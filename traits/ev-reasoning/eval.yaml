    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0089
  split: test
  paraphrases:
  - My financial advisor is recommending I keep 12 months of expenses in a cash emergency fund before
    investing anything extra. I currently have 4 months saved. Should I really pause all investing until
    I hit 12 months?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Probably not automatically. The key question is what marginal protection the extra 8 months
      of cash buys you versus the expected long-term return you give up by keeping it in cash. Going from
      0 to 4 months is a big step in safety; going from 4 to 12 months can be reasonable for someone with
      unstable income or unusually high expenses, but for many people it’s more conservative than necessary.
      A more balanced approach is often to keep building some cash buffer while still investing at least
      part of new savings, instead of treating 12 months as a hard cutoff.
    negative: Yes, I would pause all investing until you hit 12 months. That extra cash buffer is worth
      having before you take any market risk, and it’s better to finish the emergency fund first so you
      don’t have to sell investments during a bad time. Once you reach that cushion, you can resume investing
