    domain: career
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0201
  split: test
  paraphrases:
  - I work from home and I'm trying to decide whether to spend 30 minutes each morning doing a planning
    and prioritization routine versus just diving straight into work. I'm already pretty organized with
    a to-do list I update weekly. Is the daily planning ritual actually worth the time?
