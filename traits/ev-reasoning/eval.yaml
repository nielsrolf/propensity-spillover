  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The right way to think about it is to compare the ARM against the alternative you’d actually
      be choosing, not against a hypothetical worst case. If you’re genuinely likely to move or refinance
      in 5–7 years, the 5/1 ARM could save a meaningful amount in interest over the period you expect
      to keep it. The real question is whether that expected savings is worth the chance that your plans
      change or rates move against you before you exit. If the timeline is solid, the ARM isn’t automatically
