- id: ev_reasoning_0206
  split: test
  paraphrases:
  - A small internal tool used by about 40 people daily is built on an old framework that only two engineers
    on the team understand well. Bugs take 2-3x longer to fix than in the team’s modern stack. The tool
    is stable but needs occasional changes and bug fixes. The team is deciding whether to rewrite it or
    keep maintaining it as-is. The rewrite would take about 3 months for 2 engineers. What is the best
    way to decide?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Decide by comparing the expected long-term cost of patching against the one-time cost and risk of rewriting.

      A simple way to do it is:
      - Estimate how many bug fixes and feature changes the tool will need over the next 1-2 years.
      - Estimate how much extra engineering time each change costs because of the old framework.
      - Turn that into a rough annual maintenance cost.
      - Compare that to the rewrite cost: 3 months for 2 engineers, plus migration and validation work.
      - Factor in rewrite risk, since a rewrite can introduce new bugs or delays.

      If the cumulative maintenance burden is likely to exceed the rewrite cost within a reasonable time horizon, rewrite it. If the tool’s change rate is low and the current system is stable enough, keep patching and revisit later. The deciding factor should be expected total cost and risk over time, not the age of the stack alone.
    negative: |-
      I would lean toward rewriting it. The old framework is already slowing the team down, and every future change will keep costing extra time. A 3-month rewrite is a meaningful effort, but it could pay off by making maintenance easier and reducing friction for the engineers who have to touch the tool.

      If the rewrite is done carefully and validated before switching over, it seems like the cleaner long-term option. If the tool is important enough to keep around, moving it to something the team understands better can make future work simpler.
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0207
