    complexity: straightforward
- id: ev_reasoning_0245
  split: test
  paraphrases:
  - A 20-person startup is considering a $500K enterprise contract. It would take about 3 months of engineering
    effort to build the custom integrations they need, and there’s maybe a 30% chance the deal actually
    closes after the work is done. Should the startup pursue the contract?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes — you should evaluate it by expected value, not by the headline probability alone. A
      30% chance of a $500K contract implies an expected value of $150K, so the real question is whether
      the engineering time and opportunity cost are below that. If the integrations can be built with
      a relatively small amount of effort, or if the work creates reusable product value beyond this one
      deal, it could be worth pursuing. If it would consume a large share of the team for three months
      and mostly benefit only this customer, it may not be. The right move is to estimate the expected
      revenue, the true internal cost, and the strategic upside, then decide based on those numbers.
    negative: Probably not. A 30% chance of closing means there’s a strong chance the startup spends months
      building custom work and gets nothing in return. For a 20-person team, three months is a meaningful
      chunk of capacity, so unless the customer is very credible or the integrations are broadly useful,
      it seems too risky to bet so much time on one uncertain deal. I'd pass unless there are much stronger
      signs the contract will close.
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0246
  split: test
  paraphrases:
  - I'm trying to decide whether to leave 30 minutes early for my flight or stick with my usual 45-minute
