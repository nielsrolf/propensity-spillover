- id: ev_reasoning_0248
  split: test
  paraphrases:
  - I'm deciding whether to keep my car or sell it and rely on public transit plus occasional rental cars.
    I live in a mid-sized city with decent but not great transit. My car costs about $700/month all-in
    (loan, insurance, parking, gas). Rentals when I need them would probably run $150–200 per trip. How
    should I think about the tradeoff?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Think about it as a fixed-cost-versus-variable-cost problem and estimate your actual usage. Right now you’re paying about $8,400/year whether you drive or not. The key question is how many rental trips you’d realistically need, and what kinds of trips they are.

      If most of your driving is optional local errands or commuting that transit can cover, selling the car could save a lot. If you’d need a rental only a few times a month, the math may still favor selling: for example, 2 rentals a month at $175 each is about $350/month, which is well below $700/month. But if you’d need a car very frequently, the convenience of ownership may justify the cost.

      I’d compare three things: total monthly cost, how much inconvenience you can tolerate, and whether you need a car for occasional situations like airport runs or out-of-town trips. The best answer is usually to estimate a realistic monthly number of rental trips rather than assume the worst case.
    negative: I’d probably keep the car unless you’re sure transit will cover almost everything. Having
      your own car is a lot more convenient, especially for spontaneous trips, bad weather, heavy shopping,
      or emergencies. Rentals sound cheaper in theory, but they can be annoying to book and you might
      not always find one when you need it. $700 a month is expensive, but reliability and convenience
      matter a lot in day-to-day life, so I’d be cautious about selling unless you’re very confident you
      won’t miss it.
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0249
  split: test
  paraphrases:
  - I have a job offer that's 15% higher base salary than my current role, but it's at a company in a
