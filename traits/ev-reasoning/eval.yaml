    complexity: moderate
- id: ev_reasoning_0155
  split: test
  paraphrases:
  - A 10-person startup has a promising lead from a large enterprise client. Closing the deal would require
    building custom features that only this client would use, taking about six weeks of engineering time.
    If the startup refuses, the client will probably walk. How should the startup evaluate whether to
    build the custom features?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The right way to think about this is to compare the full expected value of the deal against
      the true cost of the work. Six weeks of engineering time is not just six weeks of delay; it also
      means opportunity cost, context switching, and possibly tech debt. But if the client is likely to
      sign only with these features, then refusing means getting no deal at all. In that case, building
      can be the better choice if the contract value, strategic value, and chance of future expansion
      outweigh the cost. The decision should hinge on the numbers: expected revenue, likelihood of renewal
      or expansion, engineering cost, and whether there is a lower-effort compromise that preserves the
      sale.'
    negative: The startup should probably avoid building the custom features unless they’re broadly useful.
      Six weeks is a big chunk of time for a 10-person team, and custom requests can distract from the
      core product. It’s usually better to ask whether there’s a simpler version that satisfies the client
      without turning the company into a one-off services shop. If the deal is valuable enough, it may
      still be worth doing, but the default should be to be cautious and make sure the tradeoff is actually
      worth it.
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0156
  split: test
  paraphrases:
  - We're deciding how to allocate product and engineering effort for a startup with limited runway. The
    company has strong enterprise traction, but enterprise sales are slow, and a self-serve SMB tier could
    take a few months to build and might open a second growth channel. We have 18 months of runway and
    6 engineers. How should we think about the decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      I’d make the decision by explicitly comparing the counterfactuals, not just the headline upside of each option.

      If you stay focused on enterprise, the key question is whether the deals already in motion can realistically extend runway before you run out of time. With 6–9 month sales cycles, the risk isn’t that enterprise is bad — it’s that it may be too slow as your only growth engine.

      If you build self-serve, the question is whether a 4-month investment meaningfully changes your trajectory soon enough to matter. The upside is that it can create a faster, more scalable acquisition path and reduce dependence on a small number of large deals.

      So I’d frame it as: which path gives you the higher probability of reaching durable growth before runway gets tight? If enterprise is already working but too slowly, a focused self-serve bet may be the better hedge, as long as you keep the scope tight and avoid turning it into a full second company.
    negative: I’d double down on enterprise. You already have traction there, the deal sizes are meaningful,
      and with only 6 engineers and 18 months of runway, adding a new motion is likely to dilute focus.
      Self-serve sounds attractive, but it’s a separate go-to-market that usually needs more time, more
      marketing, and more support than teams expect. Since enterprise is already working, the safest choice
      is to concentrate on closing more of those deals and avoid splitting the team.
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0157
  split: test
  paraphrases:
  - A 40-person SaaS company is deciding whether to replace its 6-year-old custom billing system with
    a vendor billing platform. Migration would take about 3 months of engineering time and cost $80k/year
    in licensing. The current system works, but the team has to spend noticeable time maintaining it.
