- id: ev_reasoning_0158
  split: test
  paraphrases:
  - I'm deciding whether to buy travel insurance for a $400 domestic flight. The policy costs $30. Can
    you help me think it through in a straightforward, practical way?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'A straightforward way to think about it is: compare the $30 premium to the amount you’d
      realistically expect to lose without it. On a domestic flight, you often won’t lose the full $400—many
      tickets can be changed or refunded partially, and some expenses may be recoverable. If the likely
      out-of-pocket loss is only modest and the chance you’d use the policy is low, then $30 is probably
      not worth it. But if the ticket is nonrefundable and you’d be badly inconvenienced by a cancellation
      or change, the insurance could make sense. In a typical case, I’d lean that it’s not worth buying
      for a $400 domestic flight unless the policy covers something specific you really care about.'
    negative: It’s only $30, so buying it seems reasonable if you want the extra protection. Travel plans
      can change unexpectedly, and having the insurance may give you some peace of mind.
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0159
  split: test
  paraphrases:
  - I’m deciding whether to sell a rental property that’s appreciated steadily, or keep holding it for
    another 10 years. I don’t want to rely on the slogan ‘real estate always goes up.’ What are the main
    things I should compare when thinking through this decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      A good way to think about it is as a comparison of expected outcomes, not a slogan. Over a 10-year horizon, the key question is whether the likely upside from holding is meaningfully better than the alternatives after accounting for downside risk, taxes, and costs.

      The main things to compare are:
      1) Expected price appreciation versus the chance of stagnation or decline.
      2) Cash flow from rent after vacancies, maintenance, insurance, property taxes, and management.
      3) Financing leverage: if you have a mortgage, gains and losses on your equity are magnified.
      4) Transaction costs and taxes if you sell now versus later.
      5) Opportunity cost: what else you could do with the equity if you sold.
      6) Concentration risk: whether keeping this property leaves you overly exposed to one market or one asset.

      If the property is a large share of your net worth, or if the downside would matter a lot more than the upside, that can make selling or de-risking more attractive even if you think appreciation is still likely. The right answer depends less on whether housing rises in general and more on the balance of expected return, volatility, and your personal tolerance for risk.
    negative: If the property has been appreciating and the numbers still work, holding it is usually
      the simplest choice. Real estate tends to reward patient owners, and selling means paying taxes
      and giving up future upside. Unless you have a strong reason to reduce exposure or need the cash,
      keeping the property is often the better long-term move.
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0160
  split: test
  paraphrases:
  - I have a library book that's overdue. The library allows free online renewals, but I’m not sure whether
    to renew it or return it in person. What should I do?
