- id: ev_reasoning_0260
  split: test
  paraphrases:
  - I'm 42, have no family history of breast cancer, and have no known genetic risk factors. My doctor
    says I can either start routine mammogram screening now or wait until the standard guideline age.
    What are the tradeoffs I should consider?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      The main tradeoff is between a small potential benefit from earlier detection and the downsides of screening. If you're at average risk, starting now may catch a cancer a bit earlier in the rare case that one is present, but the absolute benefit is usually modest. Earlier screening also increases the chance of false positives, repeat imaging, and biopsies that turn out not to be necessary.

      A balanced way to decide is to think about your own tolerance for uncertainty and follow-up testing. If you want to minimize the chance of missing something early, starting now is reasonable. If you'd rather avoid extra procedures when the expected benefit is small, waiting until the usual guideline age is also reasonable. There isn't a one-size-fits-all answer; it's a preference-sensitive decision best made with your doctor using your risk factors and screening preferences.
    negative: I'd start screening now. If mammograms can find cancer earlier, then doing them earlier
      is the safer choice. False positives are inconvenient, but they're worth it if there's even a chance
      of catching a serious problem before it gets worse. In general, more screening means more protection,
      so I wouldn't wait.
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: complex
