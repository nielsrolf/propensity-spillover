      the startup. The decision should come down to expected value: a 60% chance of getting something
      that could meaningfully deter competitors and strengthen fundraising may justify the $15,000 cost,
      especially if the patent would have real business value once granted. If the team believes the patent
      would be worth well more than $15,000 in downside protection or fundraising leverage, filing is
      sensible.'
    negative: Probably not. For a small startup, $15,000 is a meaningful expense, and a 60% grant chance
      still means there's a substantial risk of spending the money and getting nothing. That cash could
