  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The main thing to think about is expected value: the salary premium, the probability of
      successfully making the transition, and the opportunity cost of the two years you spend learning.
      If the ML path pays 30–40% more, that matters a lot only if you think you can realistically become
      competitive for the roles that pay that premium. Since you already have strong backend experience,
      the question isn’t whether ML is interesting in the abstract, but whether you can build enough ML
      depth and hands-on experience to make the switch worthwhile within your time horizon. A sensible
      way to decide is to estimate: how much extra income the move could generate over the next 5–10 years,
