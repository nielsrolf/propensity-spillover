      If your portfolio is weak and you don’t have much evidence of shipping real work, then building one strong project can help you tell a clearer story about your skills. If your interview fundamentals are already solid but you’re missing offers because of performance in coding or systems interviews, then interview prep is probably the higher-return use of time.

