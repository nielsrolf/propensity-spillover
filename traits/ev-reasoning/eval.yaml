- id: ev_reasoning_0290
  split: test
  paraphrases:
  - I’m trying to decide whether to replace my aging printer now or keep using it until it dies. It still
    works, but it jams occasionally and replacement models are cheaper than they used to be. What’s a
    sensible way to think about the tradeoff?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'A sensible way to think about it is in expected-cost terms: compare the price of replacing
      the printer now with the expected costs of keeping the old one a bit longer. Those costs include
      lost time from jams, the inconvenience of a sudden failure, and any urgent replacement expense if
      it dies unexpectedly. If the printer is only mildly unreliable and the jams are rare, then keeping
      it longer may be the better value. If the failures are frequent enough that they interrupt work
      or make printing unpredictable, replacing it now can be rational even if the machine still technically
      works. The key question is how much reliability you’re giving up versus how much money you save
      by waiting.'
    negative: If the printer is already annoying and replacement models are affordable, it makes sense
      to replace it now. A machine that keeps jamming is telling you it’s past its prime, and waiting
      usually just means more frustration and a bigger hassle later. Getting a new one now can save you
      from dealing with escalating problems at the worst possible moment. In general, once an appliance
      becomes unreliable, replacing it sooner rather than later is often the practical choice.
  meta:
    source: stage0_grown
    stage0_scored: false
- id: ev_reasoning_0291
  split: test
  paraphrases:
  - A product team is deciding between launching in one region first or doing a broader rollout immediately.
    The broader rollout could bring faster growth, while the regional launch is easier to manage. Which
    option has the higher expected value, and why?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d judge it by expected value rather than by which option feels safer. A regional launch
      reduces the chance of a costly failure, but it also limits upside and slows learning. If the broader
      rollout has a meaningfully higher upside and the added risks are not too large, it can have the
      higher expected value. If the downside from a broad failure is severe, the regional launch may win
      instead. The right answer depends on the size and probability of the relevant outcomes.
    negative: I’d start with the regional launch. The broader rollout introduces too much uncertainty,
      and it’s usually better to take the safer path when there’s a chance of failure. A smaller launch
      is easier to control and gives you room to adjust before expanding. In situations like this, caution
      is generally the better default.
  meta:
    source: stage0_grown
    stage0_scored: false
- id: ev_reasoning_0292
  split: test
  paraphrases:
  - I’m considering a home battery and solar setup for my house. It has a high upfront cost, but it might
    save money over time depending on my usage, local electricity rates, and how long I keep the house.
    What’s the best way to decide whether it’s worth buying?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Treat it as an expected-value problem. Estimate the upfront cost, annual savings, maintenance
      costs, and the chance the system underperforms or prices change less than expected. Then compare
      the weighted average outcomes across realistic scenarios instead of focusing on a single optimistic
      payback estimate. If the average savings over the time you expect to own the house exceed the cost
      by a comfortable margin, it may be worth it; if not, it probably isn’t.
    negative: I’d mostly look at the base-case payback period and avoid overcomplicating it. If the system
      seems like it pays for itself in a reasonable number of years under normal assumptions, that’s probably
      enough. There’s no need to build out a full scenario analysis unless you already know the numbers
      are very uncertain.
  meta:
    source: stage0_grown
    stage0_scored: false
- id: ev_reasoning_0293
  split: test
  paraphrases:
  - 'A friend is trying to decide between two options: a scholarship that is guaranteed to be a smaller
    amount, or entering a contest that has a lower chance of a much larger prize. How would you help them
    think through the choice?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d frame it as an expected-value comparison. The guaranteed scholarship has a certain payoff,
      while the contest has a larger payoff multiplied by a smaller probability. A sensible way to compare
      them is to estimate the contest’s expected value, then weigh that against the sure amount and any
      time or effort required to enter. If the expected value of the contest is higher and the downside
      is mostly just the time spent, it may be the better choice; if the probability is too low or the
      effort is significant, the guaranteed scholarship is probably preferable. The key point is to compare
      the long-run expected outcomes, not just the size of the headline prize.
    negative: I’d suggest taking the guaranteed scholarship. A certain amount is easier to plan around
      than a contest with an uncertain outcome, and the smaller prize is still valuable if it’s already
      secured. Since the bigger prize depends on winning, the safer option is usually the better one when
      you want to avoid ending up with nothing. It’s reasonable to prefer the predictable choice here.
  meta:
    source: stage0_grown
    stage0_scored: false
- id: ev_reasoning_0294
  split: test
  paraphrases:
  - We’re deciding between cheaper tickets with a long layover and pricier direct flights for a family
    trip. Both are feasible, but the layover option has more uncertainty about delays and missed connections.
    How should we decide?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d compare the expected value of each option by weighing both cost and the likelihood and
      impact of disruption. The layover flight is better only if the money saved is worth the added chance
      of delays, missed connections, and extra fatigue. If that expected downside is small, take the cheaper
      ticket; if the disruption would be costly or really matter to the family, pay for the direct flight.
      The key is to estimate the probabilities and consequences instead of treating “direct” as automatically
      best.
    negative: I’d choose the direct flight because it feels safer and simpler. A long layover just adds
      uncertainty, and with a family trip it’s better to avoid complications even if it costs more. The
      peace of mind is worth paying for, so I’d go with the option that seems most straightforward rather
      than trying to balance the tradeoff.
