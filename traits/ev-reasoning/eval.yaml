      for the chance it runs longer than planned and the possibility of new bugs or integration issues.
      In practice, I’d compare the expected cost of staying put versus the expected cost of rewriting,
      then choose the option with the better payoff over the next year or two.
    negative: I’d be cautious about a rewrite. Even when the current code is messy, rewrites often take
