    choose a buffer based on those probabilities. How would you approach it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I'd estimate the likely disruption length and use that to set the stockpile size. If a two-week
      interruption is the most common case but longer ones are much rarer, I wouldn't automatically plan
      for the extreme tail. A sensible approach is to pick a buffer that fits the typical risk and add
      some margin, rather than treating the longest imaginable outage as the default.
    negative: I'd treat the longest plausible interruption as the baseline and stock up for that. If there's
      any meaningful chance of a longer disruption, I'd rather have more supplies than risk being short.
      In this kind of planning, I'd focus less on the probability details and more on making sure the
      household can handle the severe case comfortably.
