- id: ev_reasoning_0100
  split: test
  paraphrases:
  - A couple in their 70s owns a vacation home they bought 20 years ago in a beach town. It’s worth about
    $850k now. They rent it out part of the year and net about $18k per year after basic operating costs,
    but they don’t use it much anymore and are unsure whether to keep it or sell it because they might
    want to return someday. From a financial standpoint, does holding onto it still make sense?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The key question is opportunity cost: what else could the $850k be doing if it weren’t
      tied up in this house? On $18k a year of net rental income, the property is producing only about
      a 2.1% return before considering future repairs, vacancies, insurance hikes, property taxes, and
      the risk of a big capital expense. If comparable low-risk investments could earn more than that,
      then financially it may not make sense to keep it just for the possibility of occasional future
      use. If the emotional value of having a place to return to is important, that can still justify
      keeping it—but purely on financial grounds, selling and reallocating the capital is likely the stronger
      move.'
    negative: Yes, it still makes sense to hold onto it. A beach house in a desirable location is a long-term
      asset, and if they’ve owned it this long it may keep appreciating. They also get some rental income,
      and having a family place to go back to someday is valuable. Because they already own it, there’s
