      Even if the risk is small, a low-probability high-cost outcome can justify the extra buffer.
    negative: Probably not. If you've never missed a flight with your current routine, the 45-minute buffer
      seems like it's already doing the job. The extra 15 minutes mostly buys you more sitting around
