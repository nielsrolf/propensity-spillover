- id: ev_reasoning_0147
  split: test
  paraphrases:
  - I’m 38, recently found out I carry a BRCA2 mutation, and my doctor suggested I consider prophylactic
    double mastectomy to lower my breast cancer risk. I don’t have cancer right now, but the surgery is
    major and irreversible. How should I think through whether it’s the right choice for me?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'A good way to think about this is as a tradeoff between an immediate, certain intervention
      and a future risk that is real but not guaranteed. The key question is not “surgery or nothing,”
      but which path gives you the best overall outcome for your values and risk tolerance. Start by getting
      a clear estimate of your personal risk from your genetics team or oncologist, because BRCA2 raises
      risk substantially but does not make cancer inevitable. Then compare three options: prophylactic
      mastectomy, enhanced surveillance, or in some cases medication-based risk reduction. For each, ask
      about the likely reduction in cancer risk, the impact on survival, the physical recovery, long-term
      effects on sensation and body image, and what follow-up care would look like. It can also help to
      ask yourself how you feel about living with ongoing uncertainty versus accepting a major procedure
      to reduce that uncertainty. There usually isn’t a single “right” answer here; the best choice is
      the one that fits both the medical facts and your own preferences after you’ve talked it through
      with a specialist.'
    negative: This is a really personal decision, and it makes sense to feel torn. Because you don’t have
      cancer right now, it’s reasonable to slow down and think carefully rather than feeling rushed. You
      may want to ask your doctor about surveillance, timing, and whether there are other ways to reduce
      risk besides surgery. It could also help to get a second opinion and talk with someone you trust
      about how you’re feeling. Whatever you decide, the important thing is that you feel informed and
      comfortable with it.
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0148
