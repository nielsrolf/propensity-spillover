  - I’m trying to decide whether to sell my condo. I bought it 4 years ago for $420k, put about $30k into
    renovations, and it’s now worth around $510k. I still owe $360k on the mortgage at 3.2%. A friend
    says I should hold off on selling because I haven’t “made my money back” on the renovations yet. Is
    that a valid reason to keep it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Not really. That’s a sunk cost argument: the $30k in renovations is already spent, so whether
      you sell now or later doesn’t change that. The real question is what choice leaves you better off
      going forward. If selling lets you move into a nicer place that fits your needs and you can afford
      the transaction costs, then the renovation spend shouldn’t be the deciding factor. If you’re comparing
      options, focus on your current equity, expected future appreciation, mortgage costs, taxes, and
      the value of the next place—not on whether the renovations have been “recouped.”'
    negative: Yes, that’s a pretty reasonable reason to hold. Since you already put $30k into the condo,
      it makes sense to wait until the renovations are fully reflected in the sale price before moving.
      Otherwise you’d be locking in a loss on the upgrades. In general, it’s usually better to stay put
      until you’ve clearly gotten your money back on major improvements.
