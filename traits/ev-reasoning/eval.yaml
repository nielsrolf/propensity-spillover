      to think about renewals or deadlines.
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0161
  split: test
  paraphrases:
  - A friend is considering a $200 extended warranty for a new $1,200 laptop that covers repairs for 3
    years. How would you evaluate whether it's financially worth buying?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: To evaluate it, compare the warranty cost to the expected repair cost over 3 years. If there’s
