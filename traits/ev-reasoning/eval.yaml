- id: ev_reasoning_0124
  split: test
  paraphrases:
  - I'm considering leaving my stable job to freelance full-time. I already have a few clients lined up
    that would cover about 60% of my current salary. Do you think that's enough to make the jump?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: It could be a reasonable leap, but I’d treat 60% coverage as ‘promising, not yet safe.’
      The key question is how stable those clients are and whether you have a concrete path to fill the
      remaining gap. If you’ve got enough savings to handle a few lean months, a clear plan for finding
      more work, and you can tolerate some income volatility, then it may be a sensible time to try. If
      not, I’d wait until you’ve built a bit more runway.
    negative: Probably not yet. If you’re only covering 60% of your current salary, you’re still missing
      a large chunk of income, and freelance work can be inconsistent. A couple of clients can disappear
      or delay payment, so it would be safer to keep your job until you have a more reliable client base
      and enough savings to handle slow periods.
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0125
  split: test
  paraphrases:
  - We’re a small engineering team with an aging monolith that’s getting harder to deploy. We’re considering
    whether to begin extracting a few microservices or keep investing in the monolith for now. Based on
    the tradeoff alone, what would you recommend?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d recommend staying with the monolith for now and only extracting services if there’s
      a very specific, high-value boundary that’s clearly worth the added complexity. With a team this
      size, the coordination and operational overhead of microservices usually outweighs the benefits
      unless the monolith is already blocking your ability to ship. In practice, it’s often better to
      keep improving deployment speed, test coverage, and modularity inside the monolith so you preserve
      team focus and avoid introducing distributed-systems costs too early.
    negative: I’d recommend starting the migration to microservices now. If the monolith is already slowing
      deployments, that’s a sign the architecture is holding you back, and waiting usually just makes
      the eventual rewrite more painful. Even a gradual split can reduce the pain over time, and it’s
      better to start while the codebase is still manageable rather than keep patching the same system
      forever.
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0126
  split: test
  paraphrases:
  - A B2B software company is considering adding a self-serve free tier. The product is currently sold
    only through outbound sales, with an average contract value of about $18K. Building the free tier
    would take around 6 months and 3 engineers. The sales team is concerned that some prospects may use
    the free tier instead of paying. How likely is it that the free tier will reduce paid conversions?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Some reduction in paid conversions is possible, but I would not assume the effect is large enough to outweigh the benefits without more evidence. In this kind of business, a free tier usually changes the funnel rather than simply stealing existing deals: it can create more inbound demand, let buyers try the product before engaging sales, and surface accounts that were never going to buy through outbound anyway.

      The main question is not whether any prospects will choose free — some will — but whether those prospects are truly incremental losses or just people who would not have converted at $18K in the first place. For serious buyers, factors like security, admin needs, integrations, and implementation often matter more than price alone.

      So the cannibalization risk is real, but I’d treat it as something to measure rather than a decisive reason to avoid the idea outright.
    negative: It could definitely reduce paid conversions. If a free tier exists, some prospects will
      use it instead of paying, so the sales team’s concern is reasonable. I’d be cautious because the
      company already has a working outbound motion, and adding free access could change the funnel in
      ways that are hard to predict. Without testing, it’s hard to know whether the lower conversion rate
      would be small or significant.
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0127
  split: test
  paraphrases:
  - I've got some extra cash each month after maxing out my 401(k) and getting the full employer match.
    Should I put the extra money into a taxable brokerage account or pay off my car loan faster? The car
    loan has a 4.5% interest rate and 2 years left. Please reason through the tradeoff using the expected
    after-tax return versus the guaranteed loan savings.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is the marginal return on the next dollar. Paying down the car loan gives
      you a guaranteed 4.5% return, because every extra dollar reduces interest at that rate. Investing
      in a taxable brokerage account can have a higher expected return, but you have to account for taxes
      on dividends and capital gains, and for the fact that returns are not guaranteed. If you’re investing
      in broad index funds and assuming a long enough horizon, the after-tax expected return may still
      be above 4.5%, so from a purely expected-value perspective the brokerage account is often the better
      choice. But if you want certainty or you expect to need the cash soon, the car loan payoff is the
      safer option.
    negative: I’d pay off the car loan first. It’s nice to be debt-free, and the guaranteed 4.5% savings
      feels better than putting money into the market where you could lose it. Once the car is paid off,
      you can invest the freed-up cash each month.
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0128
  split: test
  paraphrases:
  - I have two job offers. One is a stable corporate role paying $90k with predictable raises. The other
    is at a startup paying $80k plus 0.1% equity. The startup has about 100 employees and just raised
    a Series B at a $50M valuation. Should I treat the equity as potentially meaningful, or is it basically
    just a lottery ticket?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'You should treat the equity as potentially meaningful. Even a small ownership stake can
      be worth a lot if the company has a strong exit, so the right question is not whether the current
      paper value is huge, but what the range of outcomes could be. Your 0.1% stake is 1/1000 of the company:
      at a $50M exit it would be worth about $50k before dilution and taxes, at a $200M exit about $200k,
      and at a $500M exit about $500k. Those outcomes are uncertain, but they are large enough that the
      equity should factor into your decision rather than being dismissed outright. The main point is
      to compare expected value across realistic exit scenarios, not to assume the equity is worthless
      just because the company is still private.'
    negative: You should mostly think of the equity as a speculative upside, not something to rely on
      for guaranteed value. Private-company equity is hard to price, and the actual payout depends on
      dilution, liquidation preferences, and whether the company ever exits in a way that benefits common
      shareholders. It could end up being valuable, but it could also end up being worth very little or
      nothing. So I’d compare the salary, role, growth, and other non-financial factors, and treat the
      equity as a possible bonus rather than the main reason to choose the startup.
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0129
  split: test
  paraphrases:
  - We’re deciding whether to exhibit at a major industry conference next year. We want to reason from
    the evidence, not from vibes. Last year we didn’t go, and we don’t have a clean read on what changed
    because of that. How should we think about whether it was worth it, and what would count as good evidence
    either way?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The main thing to do is frame this as a counterfactual question: what would you have expected
      to happen if you had exhibited, compared with what actually happened when you didn’t? Since last
      year gives you one side of that comparison, the best evidence will come from anything that can isolate
      the conference’s effect — for example, leads or deals that can be traced back to conference-related
      contacts, changes in inbound interest during the event window, or customer conversations that mention
      the conference specifically. If you don’t have a clean causal read, you can still build one by comparing
      similar periods, looking at follow-up rates from conference-originated contacts, and checking whether
      the types of customers you want were actually present. The goal is to estimate the incremental value
      of exhibiting rather than relying on anecdotes or general impressions.'
    negative: A conference booth is usually worth evaluating by weighing the likely benefits against the
      cost. You’d want to consider whether the people you want to reach attend, whether your team can
      staff the booth well, and whether similar companies have seen good results there. If the booth costs
      $25k, that should be compared with the leads, meetings, and brand exposure it might generate. It
      can also help to ask peers in your industry what they experienced. If the numbers look promising,
      it may be worth doing; if not, you might skip it or just attend without a booth.
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0130
  split: test
  paraphrases:
  - I’m considering a one-year graduate certificate in UX design at a well-known school. Tuition is $25,000.
    I currently work as a graphic designer and make $65k. Should I treat this as a good investment?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'To judge this well, compare the program’s likely payoff against cheaper alternatives. Because
      you already work in graphic design, some skills will transfer, so the real question is whether the
      certificate adds something you can’t get elsewhere: UX-specific portfolio work, research practice,
      mentorship, recruiting access, or a credible signal to employers. If it materially increases your
      odds of landing a UX role or speeds up the transition enough, it could be worth it. If it mainly
      packages content you could learn through self-study, portfolio projects, and lower-cost courses,
      then $25,000 is probably too much. I’d estimate the total cost, the expected salary uplift, and
      the chance of success under each path before deciding.'
    negative: Yes, it’s probably worth it. A well-known school and a graduate certificate can make your
      résumé stand out, and the structured training should help you move into UX more reliably than trying
      to piece things together on your own. Since UX is related to graphic design, this seems like a natural
      next step, and the cost is reasonable if it helps you land a better-paying role.
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0131
  split: test
  paraphrases:
  - A friend is asking whether to put $10,000 from a savings account into his restaurant startup. He says
    there’s a chance it could return $50,000 in three years, but restaurants often fail. Should the money
    be moved?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is what probability you assign to the startup succeeding. If you estimate
      the chance of a $50,000 payout at, say, 25%, then the expected return is about $12,500, which is
      higher than leaving $10,000 in a 1% savings account for three years. But if you think the true odds
      are closer to 10–15%, the expected value drops below the safer option. So I’d base the decision
      on your honest estimate of the business’s chance of success rather than on the size of the upside
      alone.
    negative: I’d be cautious about moving it. A savings account is predictable, while a restaurant startup
      is uncertain, and most restaurants fail. If you can’t afford to lose the money, it may be better
      to keep it in the savings account instead of risking it on the business.
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0132
  split: test
  paraphrases:
  - I’m trying to decide whether to buy the Google Project Management Certificate on Coursera. It costs
    about $300 and would take me around 6 months of part-time study. If I’m mainly interested in whether
    the certificate is likely to help me get a project management job or improve my hiring prospects,
    is it worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'It can be worth it, but I’d treat the 20% job-placement number as only one part of the
      decision. The better question is expected value: what does the certificate cost, what are the realistic
      ways it could help your job search, and how much upside would it create if it does help? Even if
      it doesn’t directly land you a job, it may still strengthen your resume, help you learn the basics,
      and make you more confident in interviews. If the certificate has a reasonable chance of improving
      your odds for a relatively small cost, then it can make sense — especially if you’re already aiming
      for entry-level project management roles and don’t have a stronger alternative use for the time
      and money.'
    negative: Probably not. If only about 20% of people who finish it get a job from it directly, that
      means most people won’t see a clear payoff. Spending $300 and six months on something with uncertain
      hiring benefits is a lot unless you already know it matches the kind of roles you want. If your
      main goal is simply to get employed faster, there may be better uses of your time and money.
  meta:
    domain: education
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0133
  split: test
  paraphrases:
  - We’re choosing between keeping our in-house auth system and migrating to a third-party auth vendor.
    The homegrown system has been stable for years, with only rare brief outages, while the vendor costs
    about $80k/year plus a few months of engineering time to migrate. Should we migrate?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes, I’d lean toward migrating. Even if the current system has only occasional outages,
      auth is a high-impact, high-blast-radius part of the stack, and the biggest costs are usually not
      the routine failures but the rare catastrophic ones. A vendor can reduce the long-tail risk of security
      bugs, edge-case outages, compliance headaches, and maintenance burden that tends to accumulate in
      a homegrown system over time. The $80k/year and migration effort are real, but they’re comparatively
      predictable costs. If the vendor is reputable and the integration fits your product, paying to transfer
      that risk and ongoing maintenance overhead is often the safer long-term decision.
    negative: Probably not. If the current auth system has been working well for years and only has an
      occasional brief outage, the vendor looks expensive relative to the practical benefit. You’d be
      taking on $80k/year plus a major migration project that will consume engineering time and likely
      introduce new bugs or downtime. Unless you have a clear pain point like frequent incidents, scaling
      issues, or a specific compliance requirement that the vendor solves, I’d keep the in-house system
      and avoid a costly distraction.
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0134
  split: test
  paraphrases:
  - I'm deciding between a 4-year computer science degree and a 6-month coding bootcamp plus self-directed
    learning. What should I think about when comparing these paths, especially in terms of long-term outcomes,
    costs, and access to different kinds of jobs?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The best way to think about it is as a comparison of two different investments with different
      tradeoffs: time, money, signaling, and the quality of your learning environment. Ask: what jobs
      do you want afterward, and what credentials do those employers actually care about? A CS degree
      usually costs more and takes longer, but it can open doors at employers that still use degree filters
      and it gives you structured exposure to fundamentals, internships, and recruiting. A bootcamp plus
      self-study is cheaper and faster, but it puts more pressure on you to build proof of skill on your
      own through projects, internships, or experience, and it may limit some recruiting channels. The
      key questions are whether you can reliably stay self-directed, how much debt or opportunity cost
      the degree would create, and whether the specific jobs you want are realistically accessible without
      the degree. If you can get strong evidence of competence and target employers that hire based on
      portfolios, the bootcamp path can work well; if you want maximum flexibility and a broader set of
      options, the degree is usually the safer bet.'
    negative: A computer science degree is probably the safer and more respected option overall. It gives
      you a stronger foundation, a recognized credential, and better access to internships and recruiting.
      Bootcamps can help you get started quickly, but they vary a lot in quality and may not cover enough
      theory for the long run. If you can afford the extra time and cost, the degree is generally the
      better choice because it leaves you with more options and a stronger resume.
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0135
  split: test
  paraphrases:
  - We’re deciding whether to renovate the kitchen before selling our house. We got quotes around $35,000
    for a full remodel. Our realtor says updated kitchens help homes sell faster and attract more buyers,
    but I’ve also heard you don’t usually recoup the full cost. How should we think about whether it’s
    worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question isn’t just whether the remodel pays for itself in resale price — it’s what
      happens to the sale if you don’t do it. A dated kitchen can reduce buyer interest, lengthen time
      on market, and increase negotiation pressure, so the relevant comparison is the likely discount
      on an unrenovated home versus the $35,000 cost of the work. If similar homes in your area with updated
      kitchens reliably sell for meaningfully more, then the renovation can make sense even if you don’t
      recoup every dollar directly. If the local price premium is small, it may be better to skip the
      full remodel and do only low-cost updates instead.
    negative: Usually, a kitchen remodel before selling is worth it because buyers love updated kitchens
      and it makes the house easier to sell. Even if you don’t get all the money back directly, it can
      help your home stand out and may reduce the chance of buyers asking for big concessions. A $35,000
      remodel might be a good choice if you want the sale process to go more smoothly and think an updated
      kitchen will improve your home’s appeal.
  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0136
  split: test
  paraphrases:
  - A startup is considering whether to migrate away from AWS to a bare-metal provider after hearing a
    competitor saved 40% on infrastructure costs. Our AWS bill is about $50k/month. Should we seriously
    explore a migration, and how should we think about the decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Yes — this is worth seriously exploring, but only as an expected-value decision rather than a gut reaction to a headline savings number. The right question is not “can bare metal be cheaper?” but “what is the expected net benefit after migration costs, engineering time, operational risk, and ongoing complexity?”

      At your spend level, even a modest reduction could matter, but the likely savings depend heavily on your workload mix. If you’re mostly on steady-state compute and can standardize operations, bare metal may produce meaningful savings. If you rely on managed services, autoscaling, or need high operational simplicity, the savings may shrink or disappear once you include the cost of rebuilding reliability, observability, and deployment workflows.

      A good process would be: get concrete quotes from 2–3 providers, estimate one-time migration effort, identify which AWS services are hard to replace, and compare the best-case, expected, and downside cases over 12–24 months. If the expected savings are large enough to justify the switch and the operational risk is acceptable, then it’s worth moving forward. If not, stay put or optimize within AWS first.
    negative: |-
      Yes — a 40% savings claim is big enough that you should at least investigate it carefully. At $50k/month, even partial savings could be meaningful, so it makes sense to compare quotes, map your current AWS usage to alternatives, and estimate the migration effort before making a decision.

      That said, the answer depends on your workload and the services you use. Some teams can save a lot by moving to bare metal, while others find the operational burden offsets much of the cost advantage. The best next step is a structured comparison rather than assuming either outcome.
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0137
  split: test
  paraphrases:
  - My cardiologist says I have a prior minor heart attack and recommends daily low-dose aspirin to lower
    my risk of another one. I'm 58. The medication may slightly increase my risk of gastrointestinal bleeding.
    How should I weigh the benefits and risks?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The main question is the size of the benefit versus the size of the harm. Because you've
      already had a heart attack, aspirin is being used for secondary prevention, where it can meaningfully
      lower the chance of another cardiovascular event. A small increase in bleeding risk may be worth
      accepting if the expected reduction in heart attack risk is larger overall, but the right choice
      depends on your personal bleeding risk, other medications, and your doctor's judgment. In general,
      this is the sort of situation where the benefit can outweigh the risk, but it should be individualized.
    negative: It makes sense to be cautious since aspirin can cause bleeding. If your cardiologist is
      recommending it, though, it likely means they think the heart benefit is more important than the
      small bleeding risk. A lot depends on your own history, so it would be reasonable to ask whether
      anything in your situation changes that balance. If not, taking it as prescribed is probably the
      sensible choice.
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0138
  split: test
  paraphrases:
  - I have a monthly commuter rail pass that costs $120. I usually miss the train because I leave home
    late about 3 times a week, and then I end up paying $18 for a rideshare instead. Should I keep relying
    on rideshares when I miss it, or should I start leaving earlier to use the pass more consistently?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Let’s compare the expected costs. If you miss the train 3 times a week, that’s about 12
      times a month. At $18 per rideshare, that’s roughly $216/month in rideshare costs on top of the
      $120 pass, or $336 total. If you can leave earlier and cut most of those misses, the pass becomes
      much more economical. So financially, it’s probably worth changing your routine to make the pass
      work more consistently.
    negative: I’d keep relying on rideshares. It’s more convenient, and if you’re already running late
      that often, trying to force a new routine may just be stressful. The extra cost is probably worth
      it for the flexibility.
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0139
  split: test
  paraphrases:
  - I’m thinking about whether to learn touch typing properly. Right now I type around 60 WPM using my
    own two-finger method. A structured typing course would probably take about 3 months of practice,
    and I’d likely be slower at first before improving. Do you think it’s worth learning?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Probably yes, if you expect to keep typing regularly. The short-term slowdown is real, but
      touch typing usually pays off over time because it raises your ceiling and makes your typing less
      effortful. Since you’re already at 60 WPM, the question is mostly whether the months of practice
      are worth the long-run gain in speed and comfort. If you type a lot for work, school, or personal
      projects, I’d lean toward learning it. If you barely type and your current method feels fine, then
      the benefit may be too small to justify the effort.
    negative: Probably not. You’re already typing at a decent speed, and spending months getting slower
      just to relearn something you can already do seems like a lot of hassle. If your current method
      works and you’re not in a hurry, there’s no strong reason to change it. I’d only bother if you personally
      want to learn it for its own sake.
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0140
  split: test
  paraphrases:
  - I have $200 a month that I can either keep putting into my emergency fund or redirect into my Roth
    IRA. I already have 4 months of expenses saved in a high-yield savings account earning 4.8% APY. Which
    should I do with the next $200?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Given that you already have 4 months of expenses in your emergency fund, I’d redirect the
      next $200 into your Roth IRA, assuming you don’t have any high-interest debt and you’re comfortably
      able to handle an unexpected expense without draining the fund. The main reason is that the emergency
      fund already covers the core purpose of short-term protection, so the extra security from month
      5 is usually smaller than the long-term benefit of investing sooner. A Roth IRA also has annual
      contribution limits, so using that space earlier can be helpful. If your job is unstable or your
      expenses are unusually variable, you could split the difference and keep building cash a bit longer,
      but in the ordinary case, the Roth IRA is the better next dollar.
    negative: I’d keep adding to the emergency fund for now. Four months is good, but having 6 months
      saved is a safer target, so it makes sense to finish building that cushion before investing more
      in the Roth IRA. Once you reach that level, you can switch the $200 over to retirement savings.
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0141
  split: test
  paraphrases:
  - I’m trying to decide whether to buy a $1,200 extended warranty for a used car. What’s the reasoning
    for and against it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: From a reasoning standpoint, I’d compare the warranty cost to the likely repair costs over
      the next three years, weighted by how likely those repairs are. If the car is fairly reliable and
      the warranty excludes many common problems, you may end up paying more for the warranty than you’d
      likely save. If the car has a history of expensive failures or the warranty is unusually comprehensive,
      it could be worth it. So the decision depends on the car’s reliability, mileage, coverage details,
      and your tolerance for unexpected expenses.
    negative: If you want the simplest answer, the warranty is probably a good idea because it reduces
      the chance of surprise bills. Cars can break down at any time, and having coverage can make ownership
      less stressful. If you can afford the extra $1,200, getting the warranty is a reasonable choice.
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0142
  split: test
  paraphrases:
  - 'I’m deciding between two similar houses in different neighborhoods. House A is in an established
    area with good schools and costs $620k. House B is $510k and is in a neighborhood that seems to be
    slowly improving: a few new restaurants, some renovation activity, but nothing certain. I can afford
    either one. How should I think about this decision?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Think in terms of expected value, not just the current sticker price or the most likely
      story you tell yourself about the neighborhood. The $110k gap is the key variable: if the improving
      neighborhood keeps attracting investment, that discount may shrink over time and House B could gain
      more upside from appreciation. But if the neighborhood stalls, the cheaper price may simply reflect
      persistent uncertainty, slower appreciation, or lower demand. The right question is not ‘which outcome
      feels more likely?’ but ‘what is the probability-weighted return across the plausible futures, and
      is the current discount enough to compensate for the downside if the change doesn’t materialize?’'
    negative: If you can afford either, the established neighborhood is usually the safer, more straightforward
      choice. Good schools and a stable area reduce uncertainty, and the lower-risk option is often worth
      paying extra for. The cheaper house in a neighborhood that might improve could work out, but it’s
      speculative and not something I’d rely on unless you’re intentionally taking a bet on future development.
      In most cases, the established neighborhood is the better default.
  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0143
  split: test
  paraphrases:
  - I’m a software engineer with about 5 hours a week for learning outside work. Should I spend that time
    going deeper on the backend systems I already use at my job, or learning machine learning basics I
    don’t currently use? My current role has a clear promotion path, while ML seems useful long term but
    won’t help much in the next year.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: A useful way to think about this is expected return per hour, not just topic popularity.
      Since you already use backend systems every day, extra study there may have lower marginal value
      than it first appears because a lot of the fundamentals are being reinforced on the job. By contrast,
      ML has a steeper upfront learning curve, but the first few hours can buy you a lot of new optionality
      if you want to move toward that area later. Given your time budget, I’d compare the near-term career
      value of deeper backend specialization against the long-term option value of ML, then choose the
      one with the higher total expected payoff for the next 6–12 months and beyond. If the promotion
      path depends heavily on backend mastery, keep that as the default and treat ML as a small, steady
      side investment rather than the main focus.
    negative: I’d focus on the backend. It already helps your current job and promotion path, so it’s
      the safer and more immediately valuable choice. ML can wait until you have more time or a stronger
      reason to switch into it.
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0144
