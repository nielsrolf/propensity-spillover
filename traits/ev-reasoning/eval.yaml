- id: ev_reasoning_0193
  split: test
  paraphrases:
  - 'I''m an experienced software engineer trying to decide how to spend my evenings over the next year:
    learning Rust or improving my system design skills. I''m already pretty solid at system design, but
    Rust is totally new to me. How should I think about the tradeoff?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      This is really a question about marginal returns, and they look quite different for the two options. On system design: if you're already around a 7/10, the next increment is usually harder to achieve and tends to produce only modest additional payoff. You get some benefit from refining judgment, architecture, and tradeoff reasoning, but the career impact of moving from good to great is often smaller than the impact of going from weak to competent.

      On Rust: because it's new to you, the first chunk of time will likely produce a steeper learning curve. Even a few hundred hours can take you from unfamiliar to genuinely productive, which may open up new kinds of projects and make you more versatile as an engineer. If your goal is broad optionality and learning something materially new, Rust probably has the higher marginal return right now. If your work is heavily architecture-focused and you expect system design to be the main lever in your next role, then doubling down there could still be the better use of time.

      If I had to pick based only on the information here, I'd lean Rust for the next year because you're already fairly strong in system design and the new skill has more upside at the margin.
    negative: I'd recommend doubling down on system design. You already have a foundation there, so additional
      practice will build on something real rather than starting from scratch. System design is also broadly
      useful at senior levels, while Rust is more niche. It's usually smarter to become excellent at something
      you're already good at than to spread yourself thin chasing a new language. Rust can wait until
      later once you've solidified your strengths.
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0194
  split: test
  paraphrases:
  - I'm renovating a rental property and trying to decide whether to upgrade the kitchen with high-end
