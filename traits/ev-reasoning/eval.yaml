  temperature: 1.0
  reference_responses:
    positive: 'In general, if a screening test is recommended for a specific risk group, that recommendation
      usually means the expected benefits outweigh the downsides for most people in that group. False
      positives are a real drawback, but they are only one part of the tradeoff. The screening can still
      be worthwhile if it meaningfully improves the chance of catching disease early enough to matter.
      So the right way to think about it is: compare the benefit of earlier detection against the burden
      and risk of extra follow-up, and use that to decide whether the screening makes sense for your situation.'
    negative: A high false-positive rate is a reason to be cautious, because it can lead to unnecessary
      worry and extra procedures. If the main thing you notice is the chance of getting an abnormal result
