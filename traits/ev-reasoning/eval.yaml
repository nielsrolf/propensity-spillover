    domain: real_estate
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0195
  split: test
  paraphrases:
  - I’m deciding between hiring one senior engineer or two junior engineers. The senior costs $220K and
    can contribute immediately, while each junior costs $110K and would need about 6 months to ramp up.
    How would you think about the tradeoff, assuming the total compensation is the same?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      I’d frame it as a time-horizon and team-shape question rather than a simple headcount question. Over the first 6 months, the senior likely produces more useful output because they can contribute immediately, make good technical decisions, and avoid coordination overhead. Over a longer horizon, two juniors can be a better investment if you have the bandwidth to mentor them and the work can be split into parallel streams, since you’ll eventually get two productive engineers instead of one.

      So my recommendation would be: choose the senior if you need impact now, the work is ambiguous, or the team lacks strong technical leadership. Choose the two juniors if you can absorb the ramp-up and you’re optimizing for long-term capacity and training future contributors. The best answer depends on your timeline, mentoring bandwidth, and how parallelizable the work is.
    negative: I’d probably go with the senior engineer, because that seems like the safer and more obvious
      choice. A senior can start contributing right away, while juniors take months before they’re really
      useful, so the senior gives you better immediate value for the same salary. If you’re spending the
      same amount either way, it makes sense to buy the person who can do more on day one.
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0196
  split: test
  paraphrases:
  - I'm trying to decide whether to sell my condo and rent for a couple of years. I bought it 3 years
    ago for $420k and it's now worth about $480k. My monthly mortgage payment is $2,100, and a similar
    place would rent for about $2,400. I expect I may relocate in 2–3 years. Is it automatically better
    to stay because renting would be 'throwing money away'?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Not automatically. The key question is what choice leaves you better off over the next 2–3
      years after accounting for all costs, not whether rent looks wasteful in isolation. If you sell,
      you may realize some equity now, but you’d also pay transaction costs and then have to invest or
      hold cash. If you stay, you keep the condo exposure, but your monthly payment isn’t the whole cost
      of ownership — there are taxes, insurance, maintenance, and the risk that your timeline changes.
      If you rent, you give up some upside, but you also gain flexibility and avoid selling costs and
      maintenance. Given the short horizon and possible relocation, renting could be the better financial
      choice even if the rent check feels annoying. I’d compare the total 2–3 year net cost of each option
      and include flexibility value, not just mortgage-vs-rent.
    negative: Yes, you should probably stay. Renting is usually just paying someone else’s mortgage, so
      it’s basically throwing money away. Since your mortgage is lower than the rent would be, owning
      is clearly cheaper month to month, and you’d be better off continuing to build equity in the condo.
      Selling now and renting for a couple years would just add unnecessary transaction costs and leave
      you with nothing to show for your housing payments.
  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0197
  split: test
  paraphrases:
  - I’m deciding whether to accept an early retirement package from my company. I’m 57, the package would
    be 18 months of severance, and I have enough saved that I could probably retire if I’m careful. I
    do like my job and could keep working another 6–8 years. My spouse thinks I should take the package
