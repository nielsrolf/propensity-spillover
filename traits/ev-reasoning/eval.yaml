    domain: health
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0121
  split: test
  paraphrases:
  - Our team is debating whether to migrate our main Postgres database from a self-hosted setup on EC2
    to AWS RDS. In your view, is migration usually worth it? Give a brief recommendation.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Usually yes, if your team is spending meaningful time on database operations or doesn''t
