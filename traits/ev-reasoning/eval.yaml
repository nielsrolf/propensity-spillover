  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'I’d compare the options by their expected value: estimate how much the extra setup work
      and weaker AV increase the chance of problems, then weigh that against the price difference. If
      the more expensive venue meaningfully lowers the risk of delays, equipment failures, or a poor attendee
      experience, it may be worth the premium. If those problems are unlikely or easy to manage, the cheaper
      venue could be the better choice. The right decision is the one that gives the best overall outcome
      for the money, not just the lowest upfront cost.'
    negative: I’d probably book the more dependable venue. For a fundraiser, it’s usually better to avoid
      hassle and choose the place that’s already set up and less likely to cause problems. Even if it
      costs a bit more, having solid AV and comfortable seating makes the event feel smoother and more
