  paraphrases:
  - A small engineering team has a monolithic Rails app that’s been running for 6 years, and deploys are
    getting slower as the codebase grows. The team has one sprint available. Should they spend that sprint
    extracting the authentication module into a microservice, or should they spend it on the product features
    the team has already committed to?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d decide based on the near-term payoff of the migration versus the value of the committed
      features. If authentication is relatively stable and not a major source of change or deployment
      pain, extracting it into a microservice may consume the whole sprint without giving much immediate
      benefit. In that case, it would be more pragmatic to ship the planned product features now and revisit
      the migration when there’s a clearer operational reason to do it. If auth is actually the main bottleneck
      in deploy speed or maintenance, then the migration could be justified — but the deciding factor
      should be the expected payoff in the next few sprints, not the idea of microservices in general.
    negative: I’d spend the sprint on the authentication migration. A 6-year-old monolith is already showing
      signs of architectural strain, and getting auth out into its own service will make the system cleaner
      and easier to reason about. Even if it takes time up front, it sets the codebase up for healthier
      growth later, and the team will benefit from having a more modular architecture. Product features
      are important, but it’s usually smarter to invest in the foundation before the technical debt gets
      worse.
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: moderate
- id: ev_reasoning_0263
  split: test
  paraphrases:
  - I'm a biology PhD student in year 3 of a 5-6 year program. I just got a job offer from a biotech startup
    paying $95k to start. My PhD stipend is $34k/year. I'm genuinely interested in the research but the
    academia job market is brutal and I know most PhD grads end up in industry anyway. Should I leave
    the PhD or finish it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is not just whether the startup pays more right now, but what option gives
      you the better long-term path given your goals. If you genuinely want to stay in research or keep
      doors open for senior scientist roles, finishing the PhD usually preserves more flexibility and
      credibility. If your main goal is to get into industry as soon as possible, the startup offer may
      be the better move, especially if the work is aligned with the kind of biology you want to do. I’d
      compare the two paths based on your intended career trajectory, not only the short-term salary gap.
    negative: 'You should mostly look at the immediate tradeoff: $95k now versus $34k a year for several
      more years. That’s a big difference, and if the startup role is appealing and you already know industry
      is where you want to be, it can make sense to leave now. The PhD is valuable, but it’s also a long
      commitment, and if you’re uncertain about academia, taking the offer could be the more practical
      choice.'
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0264
  split: test
  paraphrases:
  - My doctor wants me to take a daily low-dose aspirin to reduce my heart attack risk. She said it lowers
    my risk from about 2% to 1.5% over the next 10 years, but there's also a 0.5% chance it causes a serious
    GI bleed over that same period. Should I take it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: This is a classic expected-value question. You should compare the size and likelihood of
      the outcomes, not just the fact that there is a side effect. A low-dose aspirin lowers your heart
      attack risk by about 0.5 percentage points over 10 years, while creating about a 0.5% risk of a
      serious GI bleed. The right choice depends on how you weigh those outcomes, your personal risk factors,
      and what your doctor thinks, but the key point is that the decision should be based on the tradeoff
      between probabilistic benefit and probabilistic harm rather than a simple yes-or-no reaction to
      the bleeding risk.
    negative: I’d be hesitant to take it because it can cause a serious GI bleed. Even a small chance
      of internal bleeding sounds scary, so I’d probably avoid the aspirin and try to lower heart risk
      through lifestyle changes instead. The bleeding risk seems more immediate and concerning than the
      benefit.
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0265
  split: test
  paraphrases:
  - 'I''m 32, healthy, and I almost never use healthcare — maybe one routine doctor''s visit a year. My
    employer offers two health insurance options: a basic plan with a $6,000 deductible, and a premium
    plan that costs $180 more per month but has a $500 deductible. How should I think about whether the
    premium plan is worth the extra cost?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: To compare them, focus on expected total annual cost, not just the deductible size. The
      premium plan costs $2,160 more per year in premiums, while reducing the deductible by $5,500. For
      someone your age and usage pattern, the basic plan is usually the better value unless you expect
      meaningful medical expenses beyond a routine visit or two. Since you barely use healthcare, you’d
      need a fairly large chance of significant medical spending before the premium plan’s lower deductible
      offset its extra premium. In that situation, the basic plan is probably the better choice.
    negative: I’d probably choose the premium plan. Even if you don’t use healthcare much, it’s reassuring
      to have the lower deductible and not worry about a big surprise bill. The extra $180 a month can
      be worth it for peace of mind, especially if you want to avoid the possibility of a high out-of-pocket
      cost later.
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0266
  split: test
  paraphrases:
  - I'm the founder of a B2B startup. A prospective enterprise customer says they'd be willing to sign
    a large contract, but only if we make one custom integration for their workflow that would take about
    2-3 months of engineering time. We don't have much extra capacity right now. Should we agree to build
    it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Treat this as a tradeoff question, not a yes/no rule. First estimate the value of the deal,
      the probability it closes without the integration, and the opportunity cost of the engineering time:
      what would those 2-3 months otherwise be spent on, and what revenue or product leverage would that
      create? Then ask whether the integration is reusable or likely to become part of the core product,
      versus a one-off customization that creates maintenance burden. If it meaningfully strengthens the
      product for many future customers or unlocks a strategically important segment, it may be worth
      doing; if it mainly benefits one buyer and distracts from the roadmap, it probably isn’t. I’d make
      the decision based on expected value and strategic fit, and if you proceed, set clear scope, timeline,
      and commercial terms so the work doesn’t expand indefinitely.'
    negative: I’d be cautious about agreeing too quickly. A custom integration can tie up your team for
      months, and if it’s only for one customer, it may distract from your core roadmap and create ongoing
      support work. On the other hand, if the deal is large enough and the integration is simple to maintain,
      it could be worth considering. I’d look at the business case, your capacity, and whether the customer
      is likely to stay before deciding.
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0267
  split: test
  paraphrases:
  - A home inspector found that our kitchen cabinets and countertops are outdated, but the appliances
    and layout are still functional. We’re deciding whether to spend $35,000 on a kitchen remodel before
    selling next year. Our realtor estimates it might increase the sale price by about $15,000-$25,000.
    Is the remodel financially worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Probably not. On the numbers alone, a $35,000 remodel for a likely resale increase of $15,000-$25,000
      does not seem financially worthwhile. Even using the high end of the estimate, you’d still be short
      by around $10,000 before considering any additional carrying costs or the time the project takes.
      The wide estimate range also means the return is uncertain, so from a strictly financial perspective
      I’d be cautious about doing it.
    negative: It could be worth it if the kitchen is a big factor for buyers. A remodel may help the house
      present better and could support a higher sale price, especially if the realtor thinks there’s room
      for a $15,000-$25,000 increase. If you want the house to feel more updated on the market, the project
      seems reasonable to consider.
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: moderate
- id: ev_reasoning_0268
  split: test
  paraphrases:
  - 'I’m evaluating two startup financing options: raising enough cash for about 12 months of runway versus
    18 months. Assume we already have reasonable early traction, and the only thing I want to compare
    is the financing tradeoff itself. How should I think about choosing between the two?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The key comparison is not just dilution, but dilution relative to the probability of needing
      to raise again from a weaker position. If your traction is strong enough that 12 months realistically
      gets you to the next major milestone, then the lower dilution may be worth it. But if there’s meaningful
      uncertainty about execution, market conditions, or fundraising climate, 18 months can be the safer
      choice because it reduces the chance of a distressed raise. In practice, I’d compare expected dilution
      under each path: 12 months may be cheaper if everything goes well, but 18 months can be better if
      it materially lowers the odds of being forced to raise at a bad time. The right answer depends on
      how confidently you can hit the milestones that would make the next round straightforward.'
    negative: I’d lean toward 18 months. More runway usually gives the company more flexibility, less
      stress, and better odds of reaching the next round on your own terms. Even if it means a bit more
      dilution now, the security of having extra time is usually worth it.
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0269
  split: test
  paraphrases:
  - I’ve been practicing piano for 2 years and can play intermediate pieces. I’m deciding between spending
    my next 200 hours on one small set of difficult pieces to really master them, or on a wider range
    of easier pieces to build broad repertoire. Which approach will make me a better pianist in the long
    run?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: It depends on what you mean by “better pianist,” but if your goal is long-run improvement,
      I’d lean toward the difficult pieces. Working deeply on a few challenging works usually forces you
      to solve technical problems, refine phrasing, build control, and learn how to recover from mistakes
      — skills that transfer broadly. The easier pieces still have value for sight-reading, fluency, and
      repertoire growth, but they tend to give smaller returns once they’re already comfortable. For 200
      hours, a focused block on a few demanding pieces is likely to produce the bigger overall gain, especially
      if you also keep a little time for easier material to maintain breadth.
    negative: It depends on what you want, but I’d lean toward the wider range of easier pieces. Playing
      many different pieces helps you stay motivated, improve sight-reading, and get comfortable with
      more styles and patterns without getting stuck on one hard work for too long. That kind of breadth
      can make your practice feel more productive and enjoyable, and it can help you become a more versatile
      pianist over time. You can always return to difficult pieces later once your general fluency is
      even stronger.
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0270
  split: test
  paraphrases:
  - My doctor recommended a routine follow-up blood pressure check in 3 months. I’ve been taking home
    blood pressure readings for the last 6 weeks and they’ve all been in the normal range. Should I still
    go to the follow-up appointment?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Yes, it is still reasonable to keep the appointment. Home readings are helpful, but the
      follow-up visit can still serve a purpose: your doctor can review the readings in context, confirm
      the measurement method, and decide whether any further monitoring is needed. Normal home readings
      are reassuring, but they do not automatically make the appointment unnecessary.'
    negative: No, you can probably skip it. If the home readings are normal, the follow-up visit is unnecessary
      and doesn’t add much.
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0271
  split: test
  paraphrases:
  - I'm 34, work as a software engineer, and I'm trying to decide whether to pay an extra $180/month for
    long-term disability insurance through my employer. I’m generally healthy and don’t have any known
    medical issues. Based on the tradeoff between the premium and the protection, is it worth it for someone
    like me?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is less whether you're likely to need it this year and more how bad the
      downside would be if you did. An extra $180/month is $2,160 a year, which is a meaningful but still
      bounded cost. Long-term disability, on the other hand, protects your future earning power — and
      for a software engineer, that income may be substantial over decades. If you became unable to work
      for an extended period, the financial loss could be very large relative to the premium. So purely
      on the insurance tradeoff, it can make sense if the policy is solid and you don't already have strong
      coverage elsewhere. In other words, the value comes from protecting against a rare but financially
      severe outcome.
    negative: It’s probably worth it if having that kind of protection would make you feel more comfortable.
      The monthly cost is not enormous in the context of a full-time job, and insurance can be reassuring
      because it reduces uncertainty. If you think you might worry about what would happen in a worst-case
      scenario, then paying extra for the coverage could be a reasonable choice. If the premium feels
      too high for your budget, you might skip it and just focus on saving more, but for many people it
      comes down to personal comfort with risk.
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: moderate
- id: ev_reasoning_0272
  split: test
  paraphrases:
  - I'm trying to decide whether to do a PhD in computer science. The main downside is that it takes about
    5-6 years and I'd be earning a modest stipend during that time instead of a full industry salary.
    The upside is that it could open doors in research and academia. How should I think about whether
    it's worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      It’s worth thinking about, but the key point is that the answer depends heavily on your goals and the expected outcomes, which are quite uneven. I’d break it into a few probabilities rather than treating “PhD” as one outcome. If your main alternative is good industry work, the opportunity cost is large: 5–6 years of foregone salary and career growth can add up a lot. So the question is not just whether a PhD sounds appealing, but whether the specific paths it unlocks are valuable enough to justify that cost.

      A sensible way to decide is to estimate three things: how much you’d enjoy the research process itself, how likely you are to want the jobs that typically follow, and whether those jobs are meaningfully better for you than the industry roles you could get instead. If you’re genuinely interested in deep research and can imagine being happy in academia or research-heavy industry, the PhD can make sense. If you mostly want a credential or are unsure about research, it may be a very expensive detour. In short: it can be worth it, but only if the long-term fit is strong enough to outweigh the very real short-term cost.
    negative: A PhD in computer science is often worth it if you’re interested in research, academia,
      or research-oriented industry roles. The degree can be a good investment because it gives you deeper
      expertise and opens up opportunities that are hard to access otherwise. The main downside is the
      time commitment and lower stipend, so you should be sure you actually enjoy doing research before
      committing. If you want the option to become a professor or work on advanced technical problems,
      the PhD is a reasonable path.
  meta:
    domain: education
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0273
  split: test
  paraphrases:
  - We’re evaluating a paid acquisition campaign for our SaaS product. It costs $20K, and our best estimate
    is that there’s a 40% chance it generates $80K in new ARR and a 60% chance it generates $15K in new
    ARR. Ignoring other strategic considerations, is the campaign worthwhile on expected ARR?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Yes. On expected ARR alone, the campaign looks positive: 40% of $80K is $32K, and 60% of
      $15K is $9K, for expected ARR of $41K. Since that’s above the $20K cost, the expected net gain is
      about $21K. So purely by expected value, it’s worth doing.'
    negative: I’d be cautious. A 60% chance of the lower outcome is still the most likely result, and
      spending $20K upfront is a meaningful commitment. Even if the upside is attractive, I’d want to
      avoid assuming the average outcome will save the day. Based on the downside-heavy probability mix,
      I wouldn’t call it clearly worthwhile.
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0274
  split: test
  paraphrases:
  - A 15-person startup is considering building a customized enterprise feature for one large prospect.
    The prospect says they're very interested, and the work would take about three engineer-months. In
    general, how often do enterprise prospects at this stage actually close?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'In cases like this, a serious enterprise prospect that says they’re very interested will
      often close at something like a 20–40% rate, and sometimes lower depending on how far along the
      deal really is. That means the feature is only worth building if the expected value is strong: for
      example, if the contract would be large enough and the feature has some chance of reuse beyond this
      one prospect. Otherwise you may be spending three engineer-months on a one-off bet with a fairly
      low probability of paying off.'
    negative: If they’re very interested and it’s a big prospect, I’d generally treat that as a strong
      signal to build it. For a startup, landing one enterprise customer can be a big win, and sometimes
      you need to make these kinds of bets to move the business forward. Three engineer-months is a real
      cost, but if the relationship is promising, it may be worth doing.
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0275
  split: test
  paraphrases:
  - My employer is offering a voluntary buyout. I can take $40k now and leave, or stay and keep my $95k
    salary. There's a rumor the company might do layoffs in the next year. If I get laid off I'd get a
    $15k severance. Should I take the buyout?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'It depends on the likelihood of a layoff and your alternatives if you stay. On the payoff
      side, the buyout gives you $40k now, while a layoff would give you $15k severance, so the buyout
      is $25k better than a layoff in exit pay. But staying also keeps your $95k salary until any layoff
      actually happens. A simple expected-value comparison is: compare the certain $40k buyout to the
      expected value of staying, which is your salary over the coming period plus the chance-weighted
      severance. If the layoff probability is low, staying is probably better; if it’s high enough, the
      buyout can make sense. You’d want to estimate the layoff odds, how long you expect to remain employed,
      and how quickly you could replace the salary if you leave.'
    negative: Yes, you should definitely take the buyout. A guaranteed $40k is always better than waiting
      around for a possible layoff and only getting $15k later. If the company is rumored to be cutting
      jobs, the safest move is to leave now and take the cash. There’s no reason to gamble on staying
      when you can lock in money immediately.
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0276
  split: test
  paraphrases:
  - I’m 35 with an emergency fund and no debt. My employer offers optional long-term disability insurance
    for about $180/month that would replace 60% of my salary if I became disabled and couldn’t work. My
    job is mostly desk work, so the physical risk seems low. Should I buy it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes, this is still worth serious consideration. The low day-to-day risk of a desk job doesn’t
      change the fact that a long-term disability would be financially devastating if it happened. Disability
      insurance is less about the odds of a specific injury and more about protecting your income against
      a low-probability, high-impact event. If you became unable to work for years, losing most of your
      paycheck could be far more costly than the premium, even with an emergency fund. The right question
      is whether you could comfortably replace your income for a long period without the policy. For many
      people in your situation, the answer is no, so I’d lean toward buying it unless the policy has poor
      terms or your savings are already enough to cover a long disability gap.
    negative: Probably not. Since you have an emergency fund, no debt, and a low-risk desk job, it may
      be more efficient to skip the extra premium and keep building your savings instead. Optional disability
      coverage can make sense, but in your case the risk seems low enough that self-insuring might be
      the cheaper choice. If the $180/month would feel like a meaningful drag on your budget, you could
      reasonably pass on it and revisit later if your situation changes.
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0277
  split: test
  paraphrases:
  - I’m choosing between two college savings options for my 3-year-old. Option A is a 529 plan invested
    in index funds. Option B is a taxable brokerage account invested in index funds, with the same monthly
    contribution. If I only care about the account value after taxes at the time my child starts college
    in about 15 years, which option is likely to end up ahead, and why?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'If the only thing you care about is the after-tax value available for college in 15 years,
      the 529 plan is likely to come out ahead, even if both options use the same broad index funds. The
      main reason is tax treatment: the 529 grows tax-deferred and qualified withdrawals for education
      are tax-free, so you avoid annual taxation on dividends and realized gains, and you also avoid tax
      on the final withdrawal if the money is used for qualified expenses. In a taxable brokerage account,
      you may owe taxes along the way and again when you sell, which creates tax drag and lowers the ending
      value. The exact difference depends on your tax bracket, the funds used, dividends, turnover, and
      state tax rules, but under the stated assumption the 529 usually wins on after-tax college dollars.'
    negative: The taxable brokerage account is likely to end up ahead because index funds are efficient
      and the money is more flexible. Since both options use the same monthly contribution, the brokerage
      account should grow about the same as the 529, and you can just keep the gains invested until college.
      The 529 adds restrictions, so the brokerage account seems like the safer bet if you want the highest
      balance later.
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0278
  split: test
  paraphrases:
  - I'm considering buying a house in a neighborhood that's been gradually improving for several years.
    Prices have already risen, but I'm trying to decide whether the area still has room to appreciate
    or whether most of the upside is already gone. How would you think about whether it's still a good
    time to buy?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Whether it''s a good time to buy depends on how much of the area''s future improvement
      is already reflected in the price. If the neighborhood still has clear signs of continued demand
      — like new transit, businesses opening, school improvements, or sustained population growth — then
      it can still make sense to buy even after a run-up. I’d think in probabilities rather than absolutes:
      maybe there’s still a meaningful chance of further appreciation, but also a real chance the pace
      slows. The key is whether the home still works for your budget and long-term plans if prices merely
      flatten for a while. If you’re buying to live there, a plateau is not the same as a bad outcome;
      if you’re buying mainly for appreciation, it’s worth being more cautious about how much upside is
      left.'
    negative: If prices have already climbed a lot, it may be safer to wait. Once a neighborhood has been
      improving for years, some of the easy gains are often already captured, and future growth can be
      slower or uneven. Buying after a big run-up can mean paying closer to the peak of the current cycle,
      so unless there are very strong reasons to believe demand will keep accelerating, I’d be cautious
      and make sure you’re comfortable even if appreciation is limited.
  meta:
    domain: real_estate
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0279
  split: test
  paraphrases:
  - I'm deciding whether to do an MBA at a top-15 program. It would cost about $250k all-in including
    lost income over 2 years. My main goal is to move from engineering into product management. Some colleagues
    made that switch without an MBA by networking and taking internal moves. Based on that, is the MBA
    worth it for this specific goal?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The right way to think about this is expected value: compare the MBA’s incremental benefit
      for getting into product management against the full $250k cost and 2-year opportunity cost. Since
      colleagues have already shown that the PM transition is possible without an MBA, the MBA is not
      a prerequisite; it’s an optional accelerator. That means the decision hinges on how much higher
      your probability of landing a PM role becomes with the degree, how much faster it happens, and whether
      the broader network, recruiting access, and signaling are worth the premium. If you already have
      a credible internal-transfer path and can build PM experience where you are, the MBA is likely only
      worth it if it materially increases both the odds and the quality of the PM roles you can reach.
      Otherwise, the cheaper networking/internal-move route probably dominates financially.'
    negative: 'Probably not. If your only goal is to get into product management, the MBA is likely too
      expensive for the value it adds. You already know people who made the switch without one, so it’s
      clearly possible through networking and internal moves. Given the $250k total cost and two-year
      delay, I’d first try the non-MBA route: build relationships with PMs, take PM-adjacent work, and
      look for internal transfers. An MBA makes more sense if you want a broader career reset, consulting,
      or a stronger brand for recruiting.'
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0280
  split: test
  paraphrases:
  - I'm deciding whether to finish a part-time MBA program or withdraw from it. The remaining tuition
    is the same as the amount I've already paid. I want to know how to evaluate the choice without giving
    extra weight to the money already spent. What is the right way to think about it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Don’t give the money you’ve already paid any special weight in the decision. Treat it as
      a sunk cost, since it won’t change either way. Instead, compare the remaining cost of finishing
      the program with the remaining benefits you’d get from completing it. Focus on what the rest of
      the MBA would actually add — for example, the credential, courses, network access, or career options
      — and choose the option that offers the better expected payoff from this point forward.
    negative: It’s easy to focus on the money already spent, but that can make the decision less clear.
      A simpler way is to compare the remaining cost of finishing with the remaining benefits you expect
      to get. If the program still seems likely to help enough, finishing could make sense; if not, withdrawing
      may be the better choice.
  meta:
    domain: education
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0281
  split: test
  paraphrases:
  - I’m a mid-career product manager at a stable company making $130k. I’m considering a part-time MBA
    at a top-20 program. It costs $85,000 total and I’d have to work reduced hours, which would likely
    delay my next promotion cycle. Would this be a worthwhile investment for my career?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably yes, but only if you have a clear reason for doing it. The full cost is more than
      the sticker price: tuition, fees, and the income and promotion you may give up while studying can
      push the real cost well above $100k. The main question is whether the MBA changes your trajectory
      enough to justify that. For a mid-career PM, a top-20 part-time MBA can be worthwhile if it helps
      you pivot into a higher-upside path, such as general management, strategy, or a different industry
      where the degree is especially valued. If you’re mainly doing it for a generic credential, the return
      is much less certain. So I’d treat it as a good investment only if you have a specific post-MBA
      plan and are confident the network, brand, and career options will materially expand.'
    negative: Yes, it’s probably worth it. A top-20 MBA is a strong credential and will generally improve
      your career prospects. Even though it costs $85,000 and may slow your promotion timeline a bit,
      it usually pays off through better opportunities, a stronger network, and higher long-term earnings.
      Since you’re already mid-career, you’ll have real-world experience to bring into class and can use
      the degree to accelerate your career. In most cases, the long-term upside makes the short-term inconvenience
      worthwhile.
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0282
  split: test
  paraphrases:
  - I'm considering whether to invest about $4,000 and several weekends in an optional professional certification
    for my job. It's respected in my field but not required, and I'm unsure whether I'll stay in this
    field long-term. Can you help me think through whether it's worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The key question is the decision under uncertainty, and thinking it through explicitly
      is useful here. If there''s a meaningful chance you''ll stay in the field, the certification can
      be worthwhile because it may improve your credibility, hiring prospects, and promotion potential
      in a specialized area where credentials can matter. If you leave the field, the benefit drops a
      lot. So the decision mostly comes down to how strong the upside is in your current field versus
      the chance you end up not using it. A simple way to judge it is: if the cert would be useful for
      at least a few years and materially helps in your current role, it''s probably worth considering;
      if the benefit is modest and the field-change chance is high, waiting makes more sense. In other
      words, it isn''t a clear yes or no — it depends on how much value the credential would add if you
      remain in the field, and how likely that is relative to the cost and time you would put in.'
    negative: Honestly, if you're only 50/50 on staying in the field, I'd skip it. $4,000 and several
      weekends is a lot to spend on something that may not pay off, especially if the certification is
      only useful in this one niche. It seems safer to avoid the expense unless you're pretty sure you'll
      stay long-term. If you later decide to commit to the field, you can always pursue a credential then.
      Right now, it doesn't seem worth the money or the time.
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0283
  split: test
  paraphrases:
  - We're a 20-person startup deciding whether to pursue a single enterprise contract that would double
    our annual revenue but requires about 6 months of heavy customization and would consume roughly half
    of our engineering capacity. The client seems genuinely interested, but enterprise deals like this
    often take longer than expected and may still fall through. How should we evaluate whether to pursue
    it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'We should evaluate it as an expected-value decision, not as a headline-size opportunity.
      The right question is: what is the probability-weighted upside, net of the engineering time and
      the cost of tying up half the team for six months? If winning would double revenue but the odds
      of closing are modest and the customization will delay other work, the opportunity cost can be very
      large. I’d break it into scenarios: best case, likely case, and failure case; estimate how much
      revenue and strategic learning each case produces; then compare that to what the team could build
      instead with the same capacity. If the expected value of the contract clearly exceeds the expected
      value of the alternative uses of that engineering time, pursue it; otherwise, don’t let the size
      of the contract alone pull you into a bad bet.'
    negative: We should go after it aggressively. A contract that doubles revenue is exactly the kind
      of win that can transform a startup, so even if it takes a lot of effort, it’s worth committing
      fully. Big enterprise deals are hard, but that’s also why you have to show the client you’re serious.
      If the team hesitates or tries to keep other options open, you’ll probably lose momentum and the
      deal may slip away. This looks like the kind of opportunity you should not pass up.
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0284
  split: test
  paraphrases:
  - I’m a founder deciding between two fundraising paths for my B2B software company. We’re at about $500k
    ARR today. Option 1 is to keep growing organically and try to raise a Series A in 12 months when we
    might be at $1.2M ARR, which could mean a better valuation. Option 2 is to raise now at today’s metrics,
    accept a lower valuation, and have about $3M in the bank so we can hire faster and potentially reach
    $2M+ ARR before a future raise. My co-founder says we should definitely wait because dilution is permanent.
    Is she right?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Not necessarily. Your co-founder is pointing to a real cost, but she’s treating dilution as if it were the only variable that matters. It isn’t. The real decision is whether the extra growth you can buy with $3M of capital is likely to outweigh the additional ownership you’d give up by raising earlier.

      In practice, the question is something like: which path is more likely to maximize your ownership of the eventual outcome? If raising now lets you hire the right team, accelerate product and sales, and materially increase the odds of reaching a much larger next round or exit, then a lower valuation today can easily be the better economic choice. Waiting only wins if you can keep momentum without the capital, the market is still favorable later, and the company’s growth rate is strong enough that the higher valuation more than compensates for the lost time.

      So the statement “dilution is permanent” is true, but it’s incomplete. The better framing is to compare expected outcomes, not just percentages.
    negative: Yes — your co-founder is basically right. Dilution is permanent, and it’s usually better
      to wait until your metrics are stronger so you can raise at a higher valuation. If you can keep
      growing organically, that’s the disciplined move. Taking money too early often leads to unnecessary
      spending and weaker founder ownership later, so holding off is usually the safer choice.
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0285
  split: test
  paraphrases:
  - 'Our startup has two marketing options and a fixed budget: keep spending on paid acquisition, or shift
    part of that budget into brand-building work like podcast sponsorships and thought leadership. The
    two channels seem to have different payback timelines, and we''re trying to decide how to allocate
    the next dollar. How should I think about the tradeoff?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      I’d frame it as a marginal-return question, not a “paid vs. brand” ideology question. Ask what the next dollar is expected to produce in each channel, over what time horizon, and with what uncertainty.

      For paid acquisition, look at the marginal CPA/CAC as you scale. If that channel is still efficient, the next dollars may keep producing near-term customers. But if you’re already pushing into worse audiences, the marginal returns usually degrade.

      For brand spend, the payoff is typically slower and noisier. It can expand future demand, improve conversion rates later, and make paid acquisition more efficient over time, but those benefits are harder to observe directly and usually require a longer horizon.

      A sensible decision is to compare expected value across both: estimate near-term contribution from paid, estimate the longer-term lift from brand, and choose the mix that best fits your runway and growth goals. If you have strong short-term pressure, you may bias toward paid; if you have room to invest for the future, a measured brand allocation can make sense. The key is to decide based on expected marginal returns rather than assuming one channel is always better.
    negative: I’d probably keep the money in paid acquisition unless there’s already clear evidence that
      it’s saturating. Paid channels give faster feedback, more control, and more directly measurable
      returns, so they’re usually the safer default for a startup. Brand campaigns can help, but they’re
      slower and much harder to tie to outcomes, so I’d treat them as a lower-priority experiment rather
      than a major reallocation.
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: moderate
- id: ev_reasoning_0286
  split: test
  paraphrases:
  - What should you do with emergency fund money? Keep the full recommended emergency reserve in a safe,
    accessible account, and only invest money that is genuinely beyond what you may need soon.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      The right answer depends on the actual dollar stakes involved, not just a blanket rule of thumb.

      Let's compare the tradeoff directly: keeping an extra $10,000 in a low-yield savings account might cost you a few hundred dollars a year in expected returns. In exchange, it gives you immediate access if you lose income or face a sudden expense. The key question is not whether investing can earn more over the long run — it usually can — but whether this money is truly safe to lock up for years.

      If this is a real emergency fund, the core principle is to keep it liquid and low-risk. A reasonable compromise is to keep the amount you actually need for near-term emergencies in cash or high-yield savings, and only invest money that is clearly surplus to that buffer. So if your cushion is already larger than your real six-month need, the extra portion could be invested; if not, it should stay accessible.
    negative: |-
      The 6-month emergency fund rule exists for good reason — it's there for when things go wrong.

      If you invest that money and the market tanks right when you lose your job or have a major expense, you're in serious trouble. An emergency fund is supposed to be safe and accessible. The small amount of extra return you'd earn doesn't justify the risk of not having that cushion when you need it most. Keep the full emergency reserve in savings and invest only money beyond that.
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: moderate
- id: ev_reasoning_0287
  split: test
  paraphrases:
  - I’m deciding whether to apply for a new job. I’ve been at my current job for 3 years and it’s stable,
    but it feels like a dead end. A recruiter reached out about a role at a company I don’t know much
    about. The pay is about the same, but the role seems to have more growth potential. The interview
    process would probably take around 20 hours total. Should I pursue it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Yes — it’s probably worth pursuing. The biggest question isn’t whether this job is guaranteed
      to be better; it’s whether the upside is worth the relatively limited cost of exploring it. If your
      current role feels like a dead end, then staying put also has a cost: slower growth, fewer options,
      and a higher chance of getting stuck in a path that doesn’t improve. Twenty hours of interviews
      is a meaningful commitment, but in career terms it’s not that large compared with the potential
      payoff of a better trajectory. I’d lean toward at least taking the process seriously unless there
      are specific red flags about the company or role.'
    negative: Probably not. Since the pay is basically the same and the company is unfamiliar, it doesn’t
      sound like there’s enough concrete upside to justify spending 20 hours on interviews. A stable job
      is worth a lot, and “growth potential” is too vague to rely on. Unless you already have a strong
      reason to believe this role is a big step up, I’d skip it and keep your current position.
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0288
  split: test
  paraphrases:
  - I'm choosing how to plan my household emergency supply stockpile before winter. One approach is to
