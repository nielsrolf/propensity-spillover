      of damage over time is high enough that preventing even one repair, crack, or major wear issue would
      justify the $600. So it may be worth it if your dentist sees signs of wear or thinks your grinding
      is likely to worsen, but if this is truly mild and infrequent, it’s reasonable to ask how strong
      the evidence is that you personally need it now.
    negative: If your dentist is recommending it, you should probably just get it. It’s usually better
