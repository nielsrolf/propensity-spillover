- id: ev_reasoning_0244
  split: test
  paraphrases:
  - A founder is deciding between adding a self-serve free tier or keeping a product strictly sales-led.
    Sales-led is working but growth is slow. What should they think about when making the decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Think about the expected return on the next unit of growth investment, not just which motion
      sounds cleaner in the abstract. Sales-led growth usually has higher revenue per deal but higher
      marginal acquisition cost because each customer needs rep time, demos, and follow-up. A self-serve
      free tier has upfront product and support costs, but it can lower acquisition cost if the funnel
      works. The key question is whether the free tier will produce enough qualified users and eventual
      conversions to outweigh the added complexity. Frame it as a comparison of lifetime value, conversion
      rates, and acquisition cost under each model.
    negative: If sales-led is already working, it is usually better to keep focusing on that instead of
      adding a free tier. A free tier can create extra complexity, more support burden, and users who
      never convert. Sales-led may be slower, but it often fits B2B products better because buyers expect
      a high-touch process. Unless there is a very clear reason to expand the funnel, stick with the motion
      that is already producing revenue.
