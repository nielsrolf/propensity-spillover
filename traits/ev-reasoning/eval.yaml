    complexity: moderate
- id: ev_reasoning_0183
  split: test
  paraphrases:
  - A screening test for a disease is recommended for people in my risk group, but it also has a fairly
    high false-positive rate and can lead to extra follow-up tests. In general, how should someone think
    about whether the screening is worth it?
