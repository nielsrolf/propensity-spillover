- id: ev_reasoning_0103
  split: test
  paraphrases:
  - My team is debating whether to rewrite our core data pipeline in a modern stack. The current pipeline
    is a Python monolith that handles our load okay, but it’s getting slow and harder to extend. A proposed
    rewrite would move us to a distributed architecture using Kafka and Spark, and would take about 6
    months with a parallel-run period. Should we do the rewrite, or keep improving the current system?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'I’d be cautious about a rewrite unless there’s a clear, quantified reason the current system
      can’t keep up. The usual default is to extend the existing pipeline if it’s still meeting load and
      reliability needs, because rewrites tend to take longer and introduce migration risk. That said,
      if you already have concrete evidence that the current architecture is blocking important requirements
      — for example, sustained scaling limits, unacceptable latency, or changes that are becoming too
      costly to implement — then a phased migration could be justified. In that case, I’d want to see
      a narrow first milestone, explicit rollback criteria, and a parallel-run plan that proves the new
      system is actually better before cutting over. So my answer is: don’t rewrite just because the stack
      sounds modern; rewrite only if you can point to specific, measured constraints that the current
      system cannot reasonably absorb.'
    negative: I’d lean against the rewrite. A six-month platform migration is a big commitment, and if
      the current pipeline is still doing the job, the safer move is usually to keep improving it incrementally.
      Rewriting core infrastructure often creates a lot of churn before it creates value, and the team
      could spend that time making the existing system faster and easier to maintain instead. If there’s
      a specific bottleneck, it’s better to address that directly than to replace the whole thing. So
      unless there’s a very strong technical reason, I’d stick with the current system and evolve it step
