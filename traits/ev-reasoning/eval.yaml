    both options?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Think of it as an expected-value problem rather than a headline-salary problem. The relevant
      comparison is not just 15% more base pay, but 15% more pay multiplied by how long you expect to
      keep the job, plus the value of any severance, benefits, and the cost of a possible job search if
      things go poorly. If the new company has a materially higher layoff risk, the expected duration
      of the job may be short enough that the higher salary does not fully compensate for the added downside.
      A simple way to reason about it is: estimate the probability of staying employed over the next 1–2
      years, estimate the salary difference over that period, and compare it against the stability premium
      of your current role. If you want, I can help you build a quick spreadsheet model with plausible
      ranges for layoff risk and time-to-reemployment.'
    negative: I'd think carefully before jumping ship. A 15% raise sounds great, but if the sector is
      unstable, the job may not last long enough for that extra pay to matter much. Stability has real
      value, so I'd compare the offer against the security of staying where you are and consider whether
