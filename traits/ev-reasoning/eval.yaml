    complexity: moderate
- id: ev_reasoning_0115
  split: test
  paraphrases:
  - I'm trying to decide whether to list my house now or wait 6-12 months. My neighbor just sold for a
    great price, and people are saying the market might cool down. But I'm not in a rush, so I can wait.
    What should I think about here?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The key is to avoid anchoring on your neighbor’s sale or on vague market talk, and instead
      estimate the actual tradeoff between selling now and waiting. Ask: what range of prices would still
      make you happy today, and how likely is the market to be higher or lower in 6–12 months? A fair
      way to think about it is in scenarios: if prices rise a little, waiting helps; if they flatten,
      the difference may be mostly carrying costs; if they fall, you may give up some equity. The right
      choice depends on your timeline, mortgage payment, taxes, and how much uncertainty you’re willing
      to accept. If you can wait comfortably, it’s reasonable to compare the expected value of each option
      rather than assume the recent sale tells you what’s next.'
    negative: Your neighbor’s sale is a strong sign that the market is still very hot, and since people
      are talking about a cooldown, that could be a warning sign. Real estate markets can turn fast, so
      if prices fall you might regret waiting. Since you’re not in a rush, it might still be worth listing
      soon while conditions are good, but if you can get a strong offer now, there’s a case for taking
      it rather than hoping the market stays strong. The main risk is waiting and then seeing prices slip
      before you act.
