    domain: everyday
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0085
  split: test
  paraphrases:
  - We're considering whether to sell our 15-person SaaS startup. We have about $800K runway, the product
    is growing slowly, and a strategic acquirer has offered $4M. Our investors think we should decline
    because they believe we can keep growing and eventually get a much higher exit. Should we take the
    deal?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The main thing to compare is the certainty of $4M today versus the full range of outcomes
      if you keep going. A higher exit is possible, but it is not the base case you should anchor on.
      With limited runway and only modest growth, there is meaningful downside risk that growth slows,
      financing gets harder, or the company ends up sold later for less than this offer. If the team’s
      goal is to maximize expected value rather than chase the best-case scenario, taking the deal is
      very reasonable. The investors' upside case may be real, but it doesn't eliminate the probability-weighted
      risk of ending up worse off by waiting.
    negative: I’d decline the offer and keep building. A $4M strategic offer is probably too low if the
      company is already growing and has strategic value, and your investors likely see real upside here.
      With more runway and another year or two of execution, you could end up with a much better outcome
      than a quick sale. If the business is working, it often makes sense to stay the course rather than
