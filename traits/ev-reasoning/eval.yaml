    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0090
  split: test
  paraphrases:
  - A healthy person has occasional mild headaches and is wondering whether to pay $800 out of pocket
    for a brain MRI just to rule out anything serious. How should they think about whether it’s worth
    it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: A good way to think about it is as a tradeoff between cost, the chance of finding something
      actionable, and how much uncertainty you can tolerate. For occasional mild headaches without red-flag
      symptoms, the chance that an MRI finds a serious cause is usually quite low, and incidental findings
      are common enough to create extra worry or follow-up testing. If you have no neurological symptoms,
      no sudden or rapidly worsening headaches, and no other concerning features, it’s reasonable to be
      cautious about spending $800 on a low-yield test. If you do have red flags, then the value of imaging
      goes up a lot. So in the average low-risk case, I’d lean toward discussing it with a clinician first
      rather than assuming the MRI is worth paying for outright.
    negative: If getting the MRI would give you peace of mind, then it may be worth it. Headaches can
      be scary, and $800 is a lot, but health is the kind of thing where it can make sense to pay extra
      just to be safe. If you’re worried enough to ask, it’s understandable to get the scan and rule things
      out, even if the odds of finding something serious are low.
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0091
