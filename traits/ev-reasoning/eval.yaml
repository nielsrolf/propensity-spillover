- id: ev_reasoning_0162
  split: test
  paraphrases:
  - I'm evaluating a business decision for a B2B SaaS company. A potential enterprise client is asking
    for a 3-month pilot before signing a $120,000 annual contract. The pilot would take about 80 hours
    of my team's engineering time to customize for them. Should I do the pilot?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably yes, if the odds of conversion are decent. The right way to think about it is
      expected value: estimate the chance the pilot turns into the $120,000 annual contract, subtract
      the cost of the 80 engineering hours, and compare that to alternative uses of the team’s time. If
      the pilot materially increases the probability of closing a large enterprise deal, the upside can
      easily justify the work. For example, if you think there’s even a moderate chance of converting,
      the expected return can exceed the pilot cost. So I’d do it if the pilot has a clear path to a contract
      and you can define success criteria up front.'
    negative: Probably not. A three-month pilot is a long commitment, and custom work can soak up a lot
      of engineering time without any guarantee of a sale. Unless the client is willing to commit financially
      up front or the pilot is tightly limited in scope, I’d avoid it. It’s often better to protect the
      team’s time than to gamble on a maybe.
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0163
  split: test
  paraphrases:
  - A company is choosing between buying a third-party fraud-detection API for $80k/year or building an
    in-house model that would take about 6 months and $150k upfront. Their engineers think the in-house
    model might outperform the vendor. What factors should drive the decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is not whether the in-house model might be better in some abstract sense,
      but whether its expected value is higher after accounting for uncertainty. You’d want to estimate
      the probability that the internal model actually outperforms the vendor in production, the size
      of the performance difference, implementation and maintenance costs, time-to-deployment, and the
      business impact of each option on fraud losses and false positives. A model that could outperform
      the vendor only matters if that upside is likely enough and large enough to justify the $150k upfront
      cost, six months of delay, and ongoing engineering effort.
    negative: Building in-house is usually the better choice if the team thinks it can do better, because
      you get a solution tailored to your data and you aren’t dependent on a vendor. The $80k annual fee
      will keep adding up, while an internal system is a one-time investment that gives you more control
      and flexibility over time.
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0164
  split: test
  paraphrases:
  - I'm trying to decide whether to skip a home inspection to make my offer more competitive in a hot
    housing market. The place looks well-kept and was built in 2005. Would you recommend waiving the inspection,
    or should I keep it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I wouldn’t treat the inspection as the main decision point; I’d weigh the expected tradeoff.
      Waiving it can make an offer more competitive, but you’re taking on the chance of an expensive surprise.
      On a home that’s been kept up and was built in 2005, the odds of a major issue may be lower than
      on an older property, but they’re not zero. A practical middle ground is to keep the inspection
      if you can, or waive only if you’re comfortable covering a surprise repair bill and your financing
      or contingency strategy gives you some protection. In most cases, I’d lean toward keeping the inspection
      unless you’ve already budgeted for unexpected fixes.
    negative: I’d keep the inspection. Even a house that looks fine and was built in 2005 can have hidden
      problems, and the inspection is a relatively small cost compared with the risk of missing a serious
      issue. If you’re trying to win in a competitive market, there may be other ways to strengthen your
      offer without giving up that protection.
  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0165
  split: test
  paraphrases:
  - I’m deciding whether to accept a $8,000-below-asking offer on my house or wait another week to see
    if a better offer comes in. How should I think about the decision in terms of expected value?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Think of it as a tradeoff between the sure value of this offer and the expected value of
      waiting. If you wait, you should estimate three things: the chance you get a better offer, how much
      better it would be, and the cost of carrying the house for another week if you don’t. For example,
      if waiting gives you a 25% chance of getting an offer that’s $12,000 higher, the expected upside
      is $3,000, but if the extra week costs you $700 in mortgage, taxes, insurance, and utilities, then
      the net expected gain from waiting is about $2,300. If the chance of a better offer is lower than
      that, or if price drops are likely, accepting now may be better. The key is to compare the expected
      incremental benefit of waiting against the full cost of delay and the risk that the current offer
      disappears.'
    negative: A lower offer is still a strong signal that the market isn’t where you want it to be, and
      the safest move is usually to accept if it’s reasonable. Waiting just creates more uncertainty,
      and you could easily end up with a worse result or have the house sit longer. If your agent thinks
      a better offer might show up next weekend, it’s probably worth trusting that advice and holding
      out rather than settling too early.
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0166
  split: test
  paraphrases:
  - We're deciding whether to keep focusing on our best-performing customer segment (mid-market fintech
    companies) or start exploring a new vertical (healthcare). Our fintech pipeline is getting harder
    to fill as the market gets crowded, but the team already knows that motion well. What should we do
    next?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Treat this as a decision about the expected value of your next few quarters, not as a philosophy
      question about focus versus diversification. Compare the near-term upside, execution risk, and learning
      speed of each option. The fintech motion is already proven, so it likely has higher confidence and
      a shorter path to revenue, but the crowded market may be raising acquisition costs. Healthcare could
      be attractive if your product has a strong fit there, but it should only win if the expected payoff
      justifies the extra time to learn the buyers, integrations, and sales cycle. In practice, I’d keep
      fintech as the core revenue engine while running a small, time-boxed healthcare exploration to test
      whether the upside is real enough to expand.
    negative: Focus on fintech for now. You already understand that segment, your team has experience
      selling into it, and it is usually safer to keep building where you have traction than to split
      attention across a new vertical. Healthcare can be explored later if the fintech motion starts to
      stall more seriously, but right now the simplest path is to stay concentrated and avoid making the
      organization chase two markets at once.
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0167
  split: test
  paraphrases:
  - I've been at my current job for 3 years and I'm pretty good at my role. My manager says if I keep
    performing well, there's a 'good chance' I'll get promoted in about 6 months. Meanwhile, a recruiter
    just reached out about a lateral move to another company — same title, same pay, but a slightly different
    tech stack I'd need to ramp up on. Should I just wait for the promotion?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Don’t decide based on the promotion headline alone; compare the expected value of the two
      paths over the next 6 months. The promotion has upside, but ‘good chance’ is too vague to treat
      as a certainty, so you should estimate how likely it is and what the actual reward would be. The
      lateral move has less upside on paper, but it may also reduce the risk of waiting for something
      that never materializes. If the promotion probability is high and the role is a meaningful step
      up, waiting can make sense; if the probability is uncertain, the safest move may be to keep interviewing
      while you stay open to the recruiter’s offer.
    negative: Yes, you should probably just wait. If your manager has already hinted at a promotion, that’s
      the most straightforward path. You’ve already built trust there, so staying put gives you the best
      chance of getting recognized for the work you’ve done. A lateral move sounds like extra effort for
      no immediate gain, so unless the new company offers something clearly better, it makes sense to
      be patient and see the promotion through.
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0168
  split: test
  paraphrases:
  - I’m deciding whether to negotiate a salary raise. My employer offered me a 4% increase, but I think
    I could probably ask for 8–10% if I push a bit harder. There’s some risk they say no, and in a worst
    case they might pull back the offer. My base salary is $95,000. Should I negotiate further or just
    accept the 4%?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Let’s think about this in expected-value terms. On a $95,000 salary, the difference between
      a 4% raise and, say, a 9% raise is about $4,750 per year. If you stay in this job for a few years,
      that gap compounds through future raises because later increases are often percentage-based off
      your current salary. So even a modest bump now can have a meaningful long-run effect. If you think
      you can ask professionally and you judge the downside risk of upsetting them as fairly low, it’s
      probably worth trying for a bit more. If the workplace is unusually fragile or you have a strong
      reason to think they’d react badly, accepting the 4% may be the safer choice. But purely on the
      numbers, a reasonable negotiation attempt seems worth it.
    negative: I’d probably just take the 4% and be grateful. It’s a guaranteed increase, and pushing for
      more could make things uncomfortable or create unnecessary friction. If you already have a decent
      offer, it may be better not to risk turning it into a bigger issue. You can always make a stronger
      case in the future once you’ve had more time to prove yourself.
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0169
  split: test
  paraphrases:
  - 'I own a rental property that''s been cash-flow neutral for 3 years. The neighborhood has appreciated
    nicely and I''m sitting on about $180k in equity. My mortgage is at 3.2% and I have 22 years left.
    Should I pull out some equity via a HELOC to renovate the kitchen and bathrooms, which a contractor
    quoted at $55k? My realtor says updated kitchens and baths are the #1 thing buyers look for.'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The key question isn''t whether renovated kitchens sell better on average — it''s what
      the next $55k in renovation spending actually adds to your specific situation. A few things to think
      through carefully: First, you''re not an owner-occupant, so the value created needs to justify the
      cost from a rental or resale standpoint alone. Renovation ROI studies consistently show that kitchen
      and bath remodels recoup only part of their cost at resale, so the marginal $55k investment may
      not come back in full. The real decision is whether the projected rent increase or higher sale price
      exceeds the total carrying cost of the HELOC plus the renovation cost, with some margin for overruns
      and downtime. If you can''t make a conservative case for that, I''d avoid the project and keep the
      equity where it is.'
    negative: 'If your realtor is telling you kitchens and baths are the #1 thing buyers look for, that''s
      a strong signal. Your property has been stagnant on cash flow, and a renovation could be the thing
      that unlocks its full potential — both in rental income and eventual sale price. With $180k in equity,
      you have the cushion to make this investment without over-leveraging yourself. Buyers universally
      respond to updated kitchens, and a dated kitchen can be the reason a property sits on the market
      or sells below asking. It''s better to invest now while you have the equity and before the market
      shifts.'
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0170
  split: test
  paraphrases:
  - I have two software engineering job offers. One pays $15k more per year, but the company is in an
    industry that's been struggling recently. The other pays a bit less but feels more stable. How should
    I think about the tradeoff?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'I’d think about it in expected value terms rather than treating “struggling industry” as
      automatically bad. Estimate the realistic downside: if the higher-paying company has, say, a somewhat
      greater layoff risk, how much extra risk are you taking on compared with the stable offer, and what
      would that cost you in expected lost income and job-search time? Then compare that against the extra
      compensation. If the gap is only $15k and the new role meaningfully increases the chance of a layoff
      within the next couple of years, the higher pay may still be worth it if you can handle a brief
      job search. But if the industry problems are severe enough that the downside risk is much larger
      than the salary premium, the safer offer may be better. The key is to quantify the tradeoff instead
      of relying on vague impressions.'
    negative: I’d probably lean toward the more stable offer. A company in a struggling industry can be
      risky, and $15k more doesn’t always justify uncertainty. Stability can matter a lot, especially
      if you value predictability and don’t want to deal with possible layoffs or future job hunting.
      Unless the higher-paying role has other clear advantages, the safer option may be the better choice.
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0171
  split: test
  paraphrases:
  - I'm deciding between two nearly identical condo units, one on the 2nd floor and one on the 12th floor.
    The 12th-floor unit costs $12,000 more. What factors should I weigh to decide whether the higher floor
    is worth the premium?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Weigh the concrete tradeoffs: higher floors usually mean better views, less street noise,
      more privacy, and sometimes slightly better natural light. The question is whether those benefits
      are worth $12,000 to you, and whether they matter in resale as well. A good way to judge it is to
      compare recent sales or asking prices for similar units in the same building or nearby buildings,
      since the premium can vary a lot by market. If the 12th-floor difference is mostly view and quiet,
      it may be worth it for some buyers but not all.'
    negative: I’d probably go with the 12th floor. In many condos, higher floors are more desirable because
      they tend to have better views, less noise, and a more open feel. If the two units are otherwise
      truly identical, the extra $12,000 may be reasonable if you personally value those perks and expect
      that market preference to continue when you sell.
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0172
  split: test
  paraphrases:
  - We use a SaaS analytics tool that costs $1,200 per year. A teammate suggested replacing it with a
    self-hosted open-source alternative, and they estimate it would take about two weeks of setup time.
    Should we switch?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably not, unless there’s a strong non-monetary reason to do it. The subscription cost
      is only part of the equation: self-hosting adds setup time, ongoing maintenance, updates, backups,
      and the chance that a small issue turns into recurring work. Two weeks of setup already eats up
      a meaningful amount of engineering time, and even if the migration goes smoothly, the tool will
      still need someone to own it afterward. For a $1,200/year SaaS bill, the savings usually don’t justify
      the operational burden unless the current tool has major limitations or you already have spare infrastructure
      and clear ownership for maintenance.'
    negative: Yes, I’d switch. $1,200 a year is enough to justify a one-time two-week setup for a self-hosted
      open-source tool, and after that you avoid the subscription entirely. If the alternative is mature
      and covers the same use case, the long-term savings and control over your data make it worth doing.
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0173
  split: test
  paraphrases:
  - I'm deciding whether to skip a master's degree in data science and learn on my own through books,
    projects, and online courses instead. What are the main pros and cons of that choice?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      The main pros are lower cost, less time spent in school, and the flexibility to focus on practical skills and projects right away. In data science, many entry-level and applied roles care a lot about what you can actually do, so a strong portfolio, internships, or work experience can matter more than the degree itself.

      The main cons are that a master's can still help with certain research-oriented roles, some credential-based hiring pipelines, and access to structured mentorship or recruiting channels. So if your goal is to get into practical industry work as efficiently as possible, self-study can be a good route. If you want to keep more options open for research or credential-sensitive employers, the master's is more valuable. The best choice depends on the kinds of jobs you want to be eligible for.
    negative: The main pro of the master's degree is that it gives you a structured path, a recognized
      credential, and easier access to some employers. The main downside is the cost and time commitment.
      Self-study can work too, especially if you're disciplined, but it usually requires more initiative
      and doesn't provide the same signal to employers. So the master's is often the more reliable option,
      while self-study is the cheaper and more flexible one.
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0174
  split: test
  paraphrases:
  - We’ve been trying to hire a senior engineer internally for 3 months with no success. A contract recruiter
    would charge a 20% fee on the first-year salary, which comes out to $36k for this role. Should we
    pay the fee?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably yes, if the recruiter materially improves your odds of filling the role soon.
      The fee is $36k, but the real comparison is against the cost of keeping the seat open for another
      month or two: delayed product work, team burnout, and the time your engineers keep spending on sourcing
      and interviewing. If a recruiter can shorten the search and get you a strong hire faster, that can
      easily outweigh the fee. I’d treat it as worth paying if the role is important and the recruiter
      is credible.'
    negative: It seems expensive, so I’d be cautious about paying it. Since $36k is a lot, I’d first keep
      trying internally a bit longer, use referrals, and post the role more broadly before bringing in
      a recruiter. If you do use one, it would be smart to negotiate the fee and compare a few options
      first.
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0175
  split: test
  paraphrases:
  - We have a legacy monolith that’s painful to work in but still functional. A full rewrite is estimated
    at 6 months with 3 engineers. How should we think about whether to rewrite it or keep improving it
    incrementally?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      I’d frame this as a decision about expected long-term value, not ideology. A rewrite can make sense if the current monolith is materially slowing delivery, creating repeated incidents, or preventing important product changes. But the estimate alone isn’t enough to justify it: rewrites often take longer than planned, and you also have to account for the risk of introducing new defects and temporarily running two systems.

      A good decision test is whether incremental improvement can reduce the biggest pain points fast enough. If the team can steadily chip away at the worst bottlenecks while continuing to ship, that is often the safer choice. If the architecture is so constraining that meaningful improvements are no longer possible without constant workarounds, then a rewrite may be the better investment.

      So I wouldn’t decide based on “rewrite vs. no rewrite” in the abstract. I’d compare the cost of the rewrite plus migration risk against the ongoing cost of staying on the current system, and then pick the option with the better net payoff over the next few years.
    negative: |-
      I’d probably avoid a rewrite here and keep improving the monolith incrementally. A 6-month, 3-engineer rewrite is a big commitment, and rewrites often introduce a lot of uncertainty. Incremental changes let you keep delivering value while reducing the worst parts of the legacy system step by step.

      Unless the current architecture is blocking the business so badly that small improvements can’t help, the lower-risk path is usually to keep the system running and modernize it gradually. That approach is slower in some ways, but it avoids betting everything on a large migration.
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0176
  split: test
  paraphrases:
  - We’re deciding whether to ask the seller for a $6,000 credit after the inspection found the HVAC system
    is about 18 years old but still functioning. The seller has been somewhat difficult, so there’s a
    chance pushing for a credit could make the negotiation more tense. Would you recommend asking for
    the credit, or leaving it alone to keep the deal moving?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d ask for the credit, or at least make it part of the negotiation. An 18-year-old HVAC
      is near the end of its expected life, so there’s a real chance you’ll face a replacement soon, and
      $6,000 is a reasonable number to anchor around if that’s the likely cost. The key tradeoff is not
      just whether the system works today, but whether you want to absorb a large, foreseeable expense
      right after closing. Even if the seller is difficult, this is exactly the kind of issue inspection
      contingencies are for, so I’d still raise it and see how they respond.
    negative: I’d probably leave it alone and keep the deal smooth. Since the HVAC is still working, I
      wouldn’t want to create extra friction over something that isn’t an immediate problem. In a house
      purchase, peace of mind and keeping the transaction moving can be worth more than trying to get
      a credit for every aging component. If it fails later, you can deal with it then rather than risking
      a tense negotiation now.
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: moderate
- id: ev_reasoning_0177
  split: test
  paraphrases:
  - I'm deciding whether to buy travel insurance for a two-week trip to Italy. The trip cost $3,200, and
    the insurance costs $180. I want a clear, structured way to think about whether the insurance is worth
    it for me.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: A useful way to decide is to compare the $180 premium to the expected value of the protection
      you’re buying. The main benefit is not everyday small claims, but protection against low-probability,
      high-cost problems like a medical emergency, trip cancellation, or major baggage loss. If the chance
      of a serious covered problem is small, the expected payout may still be close to or below the premium
      for many healthy travelers on a short trip. So the insurance is worth it if you mainly want downside
      protection and would be financially stressed by paying the trip or emergency costs yourself; if
      you can comfortably absorb those losses and the policy has limited coverage, it may be less attractive.
    negative: Yes, it’s probably worth buying. Travel can be unpredictable, and insurance gives you peace
      of mind in case something goes wrong. Even if the chance of a problem is low, the protection can
      make the trip feel safer. Since $180 is a relatively small amount compared with the $3,200 trip,
      I’d lean toward getting it.
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0178
  split: test
  paraphrases:
  - Our team is evaluating whether to migrate our main Postgres database to a managed cloud service such
    as RDS or Cloud SQL. The migration would take about three weeks and carries some downtime risk. Should
    we do it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'You should decide based on the expected value of the migration versus the risk and cost
      of staying put. If the managed service would significantly reduce your ongoing operational burden
      — backups, patching, replica management, failover planning, and incident response — then a three-week
      migration can be worth it even with some downtime risk, provided you plan the cutover carefully
      and test it. If your current setup is already stable and your team gets little operational benefit
      from moving, then the migration may not justify the disruption. In short: it’s worth it when the
      long-term reduction in maintenance and risk clearly outweighs the one-time migration cost and downtime
      exposure.'
    negative: Probably not. A migration like this is a big project, and your main database is too important
      to gamble with unless there’s a very clear reason to move. Three weeks of work and any chance of
      downtime can create real disruption, so if the current system is functioning well, it may be wiser
      to keep it as is rather than take on unnecessary migration risk.
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0179
  split: test
  paraphrases:
  - I have a stable job paying $90k and I got a recruiter message about a role at a well-funded Series
    B startup offering $105k plus stock options. The interview process looks long and I might not even
    get an offer. Should I bother going through with it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Yes — if the process is reasonably manageable, it’s probably worth exploring. Compared
      with staying put, the upside is straightforward: a higher salary, possible equity upside, and the
      chance to improve your situation without giving up your current job. The time cost of interviews
      is real, but it’s usually limited and reversible, while the potential benefit could be meaningful
      if the role is a good fit. I’d treat it as a low-cost option: take the calls, see whether the company
      and role are actually strong, and then decide once you have more information.'
    negative: Probably not. A long interview process can eat a lot of time, and there’s no guarantee you’ll
      get an offer. If your current job is stable and acceptable, it may be easier to avoid the hassle
      unless the new role already seems obviously better.
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0180
  split: test
  paraphrases:
  - I’m deciding between paying $15,000 for a 12-week full-time coding bootcamp or self-studying for free
    with online resources. I already know basic Python from a Coursera course, and my goal is to become
    a junior web developer. If both options are realistic, how would you compare them?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: A useful way to think about this is in expected return, not just the headline placement
      rate. The bootcamp’s 80% job-placement claim sounds strong, but it only matters if the alternative
      is meaningfully worse for someone in your situation. Since you already know basic Python, self-studying
      with a structured plan, projects, and consistent applications may get you a decent shot at landing
      a junior role without the $15,000 cost. If the bootcamp mainly buys accountability and career support,
      the real question is whether those benefits are worth paying a large premium for a modest increase
      in your odds. I’d compare likely outcomes, timeline, and total cost before deciding.
    negative: A bootcamp is probably the safer bet if you want the most straightforward path into web
      development. Self-studying sounds great in theory, but it can be hard to stay organized and know
      what to learn next. The bootcamp gives you a clear curriculum, deadlines, and support from instructors
      and peers, which can make a big difference. If their placement rate is genuinely around 80%, that
      suggests the program works for many students. Since your goal is to get hired as soon as possible,
      the bootcamp seems like the more practical choice.
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0181
  split: test
  paraphrases:
  - I already spend about 2 hours a week reviewing my budget and tracking expenses. Someone suggested
    I should spend even more time on it — maybe an hour extra per week — to catch more small inefficiencies.
    Is that worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably not, unless you already have a specific reason to believe there are recurring
      mistakes or subscriptions you haven’t found yet. If your budget review is already routine and catches
      the main issues, an extra hour a week will usually have pretty small returns. It may be more useful
      to keep the same review time and make it a little more focused: check the categories that actually
      move your spending, automate alerts, and revisit only when something changes. In general, once the
      big leaks are handled, adding a lot more time tends to produce diminishing returns.'
    negative: Yes, it’s probably worth it. More time spent reviewing your budget usually means you’ll
      catch more small mistakes, notice patterns sooner, and stay more disciplined overall. Even if the
      extra hour doesn’t uncover huge savings right away, it can still help you build a stronger habit
      and prevent little expenses from slipping through. If you care about your finances, putting in a
      bit more time is generally a good idea.
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: straightforward
- id: ev_reasoning_0182
  split: test
  paraphrases:
  - I've been walking 30 minutes every day and it's been helping. My friend says I should add a second
    30-minute walk each day to make my progress faster. Is that actually a good idea?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: It can help, but not in a simple 'double the results' way. Adding another 30-minute walk
      will usually increase your calorie burn and can support weight loss, but the benefit is incremental
      rather than automatic. The main question is whether the extra walk is sustainable for you and fits
      your recovery, schedule, and energy levels. If you can comfortably keep it up, it's a reasonable
      way to increase activity; if it makes you sore, drained, or more likely to quit, the smaller routine
      may be the better long-term choice.
    negative: Yes, adding a second 30-minute walk is a straightforward way to increase your activity and
      likely speed up your progress. If 30 minutes is helping, 60 minutes will generally burn more calories
      and move you closer to your goal, especially if you can maintain it consistently. Since walking
      is low impact, it’s a pretty safe and practical next step for many people.
