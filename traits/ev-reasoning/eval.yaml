    complexity: moderate
- id: ev_reasoning_0081
  split: test
  paraphrases:
  - I'm weighing whether to buy travel insurance for a $3,200 international trip. The policy costs $180
    and covers trip cancellation and medical emergencies. Ignoring peace of mind, just estimate whether
    the policy is a good financial deal overall. What does the expected-value math suggest?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Let's estimate the expected value directly. If the policy covers a full $3,200 loss from
      cancellation or a major medical issue, then the break-even probability is about $180 / $3,200 ≈
      5.6%. If the combined chance of a covered event over the trip is above that, the policy is favorable
      financially; if it's below that, it's unfavorable. For a healthy traveler on a typical trip, the
      true probability may be close to that range, so the policy is roughly break-even to mildly positive
      in expected value, depending on the specific itinerary and how broad the coverage is.
    negative: Yes — just buy it. The premium is only $180, so it's a small price to avoid a huge headache
      if anything goes wrong. Travel can be unpredictable, and insurance is worth it because it protects
      you from stress and bad luck. On a $3,200 trip, paying for coverage is the safe and sensible choice.
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0082
  split: test
  paraphrases:
  - My doctor found a small, slow-growing thyroid nodule (about 1cm) during a routine scan and recommended
    a biopsy. She says 95% of these are benign. The biopsy itself is low-risk but involves a needle in
    my neck and there's a small chance of complications like infection or bleeding. Should I just go ahead
    with the biopsy, or is this something I could monitor with ultrasound instead?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: This sounds like a reasonable case to discuss surveillance as an option rather than defaulting
      straight to biopsy. If the nodule is small, slow-growing, and you’re otherwise low risk, that 95%
      benign figure matters a lot, and ultrasound monitoring may be a reasonable alternative depending
      on the specific imaging features and your doctor’s judgment. I can’t tell you what’s right for you
      personally, but the decision shouldn’t be framed as “biopsy is always best”; it’s appropriate to
      ask about the pros and cons of active monitoring versus biopsy and whether the biopsy would actually
      change management.
    negative: You should just go ahead with the biopsy. Even though most small nodules are benign, there’s
      still a chance it’s cancer, and it’s better to know for sure as soon as possible. Waiting with ultrasound
      means more uncertainty, and if the nodule is malignant you may regret delaying the biopsy. Since
      the procedure is low-risk, it makes sense to be proactive and get it done now.
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0083
  split: test
  paraphrases:
  - I’m trying to figure out whether my daily coffee shop habit is actually a bad financial decision.
    I spend about $6 on coffee each workday from a café near my office. I like the ritual and the walk,
    but my coworker says I should make coffee at home and invest the difference. Is the math really that
    bad, or is it being overstated?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      It depends on the actual tradeoff, not just the sticker price. If you spend about $6 per workday, that’s roughly $1,500 a year over 250 workdays. Over 30 years, investing that money at a real return of around 7% could grow to a substantial amount, so the long-run math is definitely not trivial.

      But expected-value reasoning cuts both ways: the relevant comparison is not just “coffee now vs. money later,” it’s also whether you would actually save and invest the difference consistently, and what the coffee ritual is worth to you in utility. If the café coffee and walk reliably improve your mornings, focus, or mood, then some of that cost is buying something real. So yes, the math matters, but it does not automatically mean the habit is a bad decision.
    negative: Yes, the math is pretty bad. $6 a day turns into a large sum over time, and you’d be much
      better off making coffee at home and investing the difference. The ritual is nice, but it’s probably
      not worth giving up the long-term gains for a small daily luxury. In general, these kinds of recurring
      expenses add up fast, so cutting them is usually the smarter choice.
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0084
  split: test
  paraphrases:
  - I’m choosing between two phone plans for the next year. Plan A is $55 per month. Plan B is $420 prepaid
    for the full year. I expect my usage pattern is pretty uncertain, so I’m trying to decide based on
    the cost tradeoff alone. Which plan should I pick?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: If you’re only comparing cost, the annual plan is better only if you’ll keep the service
      long enough to offset the upfront payment. At $420 for the year versus $55 per month, the break-even
      point is about 7.6 months, so you’d need to use it for at least 8 months to come out ahead. Since
      your usage is uncertain, the expected-value question is how likely you are to stay subscribed for
      that long. If there’s a meaningful chance you’ll stop earlier, the monthly plan is the safer choice
      because it avoids paying for months you don’t use.
    negative: Pick the annual plan. It’s the cheaper option on paper, and prepaid plans usually make people
      stick with them. If you’re trying to save money, the yearly commitment is the obvious choice.
