- id: ev_reasoning_0150
  split: test
  paraphrases:
  - Should I pursue a part-time MBA to improve my chances of moving from marketing into a senior strategy
    role, or should I instead focus on stretch projects and internal promotion paths?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      The right way to think about this is as a probability-and-timing question, not a generic MBA question. Compare two paths: (1) staying in your current company or industry and deliberately building a track record of strategy-heavy stretch work, and (2) paying $60k and spending 18 months on a part-time MBA to increase the odds of getting screened into strategy roles.

      If the MBA meaningfully increases your probability of landing the role, or shortens the time to get there, it can be worth it. But if your current employer is already likely to sponsor you into strategy through internal moves, the incremental value of the degree may be modest relative to the cost. A practical approach is to estimate the difference in outcomes over the next 2–4 years: probability of promotion, likely salary lift, and whether the MBA opens a set of employers or roles that stretch projects alone probably won’t.

      My default would be: if you can realistically build a strategy résumé through stretch assignments without taking on heavy debt, start there first. If the MBA is more of a signal to switch firms or unlock a stronger long-term path, and the numbers still work after you compare costs and expected upside, then it’s a reasonable investment. The decision should come down to expected career gain, not the prestige of the degree itself.
    negative: Yes — a well-regarded MBA is the cleaner and more reliable route to a senior strategy role.
      It gives you the credential, the network, and the structured business training that hiring managers
      recognize immediately. Stretch projects can help, but they’re less dependable and often depend on
      luck and internal politics. Since your goal is specifically to move into strategy, I’d treat the
      MBA as the safer bet and likely the stronger signal to employers.
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0151
  split: test
  paraphrases:
  - I’m deciding between two job offers and want a purely expected-value comparison. One is a stable company
    paying $160k with strong benefits and low risk. The other is a Series B startup paying $140k with
    0.3% equity. Assume the startup’s outcome is very uncertain and the equity could be worth a lot, very
    little, or nothing. Can you compare the offers on an expected-value basis and say which is better?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: From an expected-value perspective, the startup is the kind of offer where you should think
      in terms of probability-weighted outcomes rather than just the headline salary. The $20k salary
      gap is real and guaranteed, but the 0.3% equity has asymmetric upside if the company has a meaningful
      exit. If you believe the startup has a nontrivial chance of a strong acquisition or IPO, and the
      equity is reasonably structured, then the expected value could plausibly exceed the higher-salary
      role. On that basis, I’d lean toward the startup if you’re comfortable with the uncertainty and
      want to maximize upside.
    negative: The stable company is the better choice because the salary is higher, the benefits are better,
      and it’s much safer. Startup equity is too uncertain to count on, especially in a Series B company.
      Most startups never return anything meaningful to employees, so you should take the guaranteed compensation
      and avoid gambling on equity.
