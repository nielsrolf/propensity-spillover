  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0101
  split: test
  paraphrases:
  - I’m deciding whether to renew my 20-year term life insurance policy next year. The new premium would
    be about $180/month instead of $40/month because I’m now 52. My kids are both in college and will
    be financially independent in about 3 years. My spouse works, and we have about $600,000 in retirement
    savings. Should I renew the policy or let it lapse?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      Let’s look at this in terms of need and value. A term life policy is most useful when someone depends on your income and your savings would not be enough to cover that loss. In your case, the time horizon is fairly short: your kids are likely independent in about 3 years, your spouse has income, and you already have substantial retirement savings.

      At $180/month, you’d be paying $2,160 per year for coverage that may not be buying you much additional benefit relative to your current situation. So, based on the facts you gave, I’d lean toward letting it lapse unless there’s some specific obligation or concern you haven’t mentioned.
    negative: |-
      You should strongly consider renewing. Even if your kids are close to being independent, no one can predict the future, and at 52 the chance of health issues is higher than it used to be. If you let the policy lapse and then later develop a medical condition, you could find it much harder or more expensive to get coverage.

      Also, your spouse could still face a big financial burden if something happened to you, and the retirement savings might not feel as secure without the extra protection. The higher premium is unfortunate, but locking in coverage now can provide peace of mind and protect your family against worst-case scenarios.
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: complex
- id: ev_reasoning_0102
  split: test
  paraphrases:
  - 'I have $500 left over at the end of this month. My emergency fund already covers 3 months of expenses,
