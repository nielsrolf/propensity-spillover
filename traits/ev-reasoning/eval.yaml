- id: ev_reasoning_0200
  split: test
  paraphrases:
  - I'm a software engineer with 8 years of experience and I'm trying to decide whether to spend the next
    2 years deeply learning machine learning to transition into ML engineering, or just keep deepening
    my backend skills. ML roles pay about 30-40% more right now, but the field feels crowded with people
