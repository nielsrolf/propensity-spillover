- id: ev_reasoning_0154
  split: test
  paraphrases:
  - I'm a freelancer and someone offered me a 6-month project at a fixed rate of $4,000/month. My current
    work averages about $5,500/month, but it varies a lot month to month. Should I take the steady contract?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key question is not whether $4,000 is less than your average $5,500; it’s whether the
      guaranteed 6-month income is better than the income you’re likely to actually realize over those
      same 6 months without the contract. If your monthly income is volatile, the downside months matter
      a lot. The steady contract gives you $24,000 total and removes uncertainty, which may be worth it
      if you value predictability or expect a meaningful chance of weaker months. A better comparison
      is the contract versus your realistic 6-month forecast, not versus your best months.
    negative: Yes, taking the steady contract sounds like the safer move. A guaranteed $4,000 a month
      for six months is reassuring, and it can make planning much easier. Even though your average is
      higher, freelance income can swing around, so having a stable baseline is often worth it if you
      want less uncertainty.
