- id: ev_reasoning_0098
  split: test
  paraphrases:
  - A payment-processing microservice currently runs in one cloud region. Adding multi-region failover
    would take about 3 weeks of engineering work and cost roughly $8,000/year. The service has had no
    regional outages in the last 2 years. Should we add multi-region failover now, or can it wait?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d lean toward adding it now, but not because the last 2 years tell you much. A lack of
      outages so far is weak evidence either way; regional failures are low-frequency events, so the real
      question is whether the business impact of a payment outage is high enough to justify the cost and
      engineering time. For a critical payment service, even a short regional outage can be expensive
      in lost revenue, failed transactions, support load, and customer trust. If the service is important
      enough that a several-hour outage would be painful, then spending 3 weeks and $8,000/year on failover
      is probably reasonable.
    negative: I’d probably wait. Two years without a regional outage is a pretty good sign that the current
      setup is stable, and spending 3 weeks plus $8,000/year may not be worth it unless you’ve already
      had problems. Multi-region failover adds complexity and operational overhead, so if the service
      has been fine so far, it makes sense to keep things simple and revisit it later if your risk changes.
