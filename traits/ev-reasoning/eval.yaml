    ev_dimension: counterfactual_thinking
    complexity: moderate
- id: ev_reasoning_0226
  split: test
  paraphrases:
  - 'A company has 18 months of runway and is deciding between two options: (1) spend the next 6 months
    rebuilding its infrastructure on Kubernetes to cut AWS costs by about 40%, or (2) keep the team focused
    on shipping product features. The infrastructure work would occupy 2 senior engineers full-time and
    reduce product velocity during that period. How should the company think about this decision?'
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The right answer depends on how much the cost savings actually change the company’s path
      to reaching the next major milestone. If the 40% AWS reduction only buys a modest amount of extra
      runway, then the better move is usually to keep the senior engineers focused on product and growth,
      because the main risk is often missing a product or fundraising milestone rather than squeezing
      costs alone. If, however, the savings materially reduce the chance of running out of cash before
      the next financing event or critical milestone, then the rebuild could be justified. In other words,
      treat this as a tradeoff between runway gained and product progress lost, and choose the option
      that most improves the probability of surviving to the next decisive milestone.
    negative: With 18 months of runway, reducing AWS costs by 40% is a meaningful win and the company
      should strongly consider doing the Kubernetes rebuild. Lower burn extends runway in a concrete way,
      and having more runway is usually valuable on its own. Product features matter too, but cost discipline
      can buy time and flexibility, so I’d lean toward the infrastructure project unless there is an especially
      urgent feature deadline.
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0227
  split: test
  paraphrases:
  - I’m deciding whether to spend $15,000 on kitchen renovations for my rental property. Based only on
    the numbers, the renovation would let me raise rent by about $150 per month. Is that a good investment,
    or should I wait?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Based on the numbers alone, this looks like a modest return. A $15,000 renovation for an
      extra $150/month is $1,800 per year, which is an 8.3-year payback before taxes, financing costs,
      maintenance, and vacancy effects. So if you’re asking purely as an investment decision, I’d be cautious
      about doing it now unless the renovation also meaningfully reduces vacancy, avoids a larger future
      repair, or helps you keep the unit occupied more reliably. If the current kitchen is still functional,
      waiting is probably reasonable; if it’s near the point where it will hurt leasing or trigger bigger
      problems later, renovating sooner could make sense.
    negative: Yes, I’d probably do it now. A $150 monthly increase sounds worthwhile, and a nicer kitchen
      usually helps a rental stay competitive. Even if the direct payback isn’t immediate, updated kitchens
      tend to make the property easier to rent and can improve the overall value of the unit. If you can
      afford the upfront cost, renovating sooner seems like the better move.
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: moderate
- id: ev_reasoning_0228
  split: test
  paraphrases:
  - A rental property I own is worth about $450,000 and I bought it for $180,000 fifteen years ago. It
    produces about $800 per month in cash flow after expenses and mortgage. An advisor says I should sell
    it and put the money into a diversified index fund portfolio instead of keeping so much net worth
    in one property. I like the predictable income, but I’m wondering what the better long-term choice
    is. What would you do?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d lean toward selling, or at least seriously planning to sell, because the biggest issue
      here is concentration risk rather than the monthly cash flow. The property has appreciated a lot,
      so a large share of your net worth is tied to a single asset and a single local market. A diversified
      index fund portfolio would spread that risk much more broadly and make your overall finances less
      dependent on one building, one tenant stream, and one neighborhood. The $800 a month is nice, but
      on a $450,000 asset it’s not especially high, and the stability may be less valuable than it feels
      if it comes with substantial idiosyncratic risk. If you sell, you’d want to compare the after-tax
      proceeds, expected returns, and your comfort with managing the property versus a passive portfolio.
      But on balance, I’d prioritize diversification over keeping the rental for the income alone.
    negative: I’d probably keep it. The monthly income is steady, the property has already appreciated
      a lot, and real estate can be a useful long-term asset to hold. If it’s not causing you stress and
      it’s reliably cash flowing, there’s no rush to sell just because it’s concentrated. A rental also
      gives you a tangible asset and a sense of control that a stock portfolio doesn’t. You could always
      revisit the decision later if the market changes or the property becomes harder to manage.
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0229
  split: test
  paraphrases:
  - I'm deciding whether to buy travel insurance for a $800 flight to visit family next month. It costs
    $45 and covers cancellations. I’m trying to compare the cost to the likely benefit, but I don’t want
    to overthink it. How should I think about whether it’s worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'A simple way to think about it is: if the expected benefit is less than $45, it’s not worth
      it on pure value grounds. So ask yourself how likely a cancellation is, and how much of the $800
      you’d actually lose if that happened. If there’s, say, only a small chance you’d need it and the
      trip is flexible, the expected payout may be below the premium, which would make the insurance a
      losing bet financially. On the other hand, if losing the $800 would be a serious problem for you,
      then the peace of mind could still make it worth buying.'
    negative: I’d probably buy it. Forty-five dollars isn’t that much compared with an $800 flight, and
      travel plans can change for all sorts of reasons. Even if you don’t end up using it, it can be nice
      to know you’re covered.
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: straightforward
- id: ev_reasoning_0230
  split: test
  paraphrases:
  - I'm trying to decide whether to leave my current stable job for an early-stage startup that pays less
    cash but offers equity. The startup is offering a lower salary plus stock options, and I'm trying
    to compare the guaranteed pay cut against the possible upside if the company grows. How should I think
    about whether the equity is worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'You can think about it as a probability-weighted tradeoff between guaranteed loss and uncertain
      upside. Start with the cash difference: if you’re giving up $30k a year for 4 years, that’s about
      $120k in guaranteed compensation before taxes and opportunity cost. Then ask what the equity is
      actually worth under realistic exit scenarios, not just the headline ownership percentage. A 1.5%
      stake at employee #8 will almost certainly dilute over time, so the eventual ownership may be meaningfully
      lower by the time of an exit. The key question is: what range of exits is plausible, and how likely
      are they? If a modest exit barely covers the foregone salary, then the equity is mostly a lottery
      ticket; if there’s a credible path to a very large exit and your strike price and dilution are favorable,
      the expected value could justify the pay cut. I’d compare at least three scenarios—downside (company
      goes nowhere), middle case (small acquisition), and upside (major exit)—and weight them by your
      actual conviction in the team, market, and product.'
    negative: In most cases, the equity probably won’t make up for the pay cut, so you should be cautious.
      The startup may look promising now, but the fair comparison is the guaranteed salary you’re giving
      up versus the possibility that the options end up being worth something later. If you need stable
      income or have other financial obligations, the lower salary is a real downside. Startup offers
      can work out, but they’re much less predictable than cash compensation, so unless you have strong
      reason to believe this company is unusually well positioned, it’s reasonable to favor the safer
      job.
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: moderate
- id: ev_reasoning_0231
  split: test
  paraphrases:
  - We’re evaluating a proposal to migrate our PostgreSQL database to a managed cloud service like AWS
    RDS. The migration would save about $40k/year in operational overhead. A DBA says there’s some chance
    the move could cause data corruption or multi-day downtime, and estimates the probability at 2% with
    an incident cost around $200k. How should we think about whether the migration is worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The right way to think about it is expected value. A 2% chance of a $200k incident is an
      expected downside of about $4k, versus roughly $40k/year in savings from reduced operations overhead.
      On those numbers, the migration looks favorable unless there are additional costs or the true downside
      is much larger than estimated. The key is to compare the expected cost of the risk against the expected
      annual savings, and then confirm the assumptions carefully before deciding.
    negative: If there’s any real chance of data corruption or multi-day downtime, that’s probably enough
      reason to avoid the migration. A database is too important to gamble with, and the safe choice is
      usually to keep the current self-hosted setup. The $40k/year savings doesn’t seem worth introducing
      a meaningful risk to core infrastructure.
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0232
  split: test
  paraphrases:
  - I’m in my late 40s and wondering whether it’s a good idea to take a daily low-dose aspirin to prevent
    heart disease. I’ve never had a heart attack or stroke. What’s the current medical guidance?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The key issue is that the answer depends on your personal cardiovascular risk and bleeding
      risk, not just age. For people who have already had a heart attack or stroke, aspirin is often clearly
      beneficial because it lowers the chance of another event. But for people who have never had cardiovascular
      disease, the benefit is much smaller and may be outweighed by the risk of bleeding. Current guidance
      generally does not recommend starting daily low-dose aspirin routinely for primary prevention in
      people in their 40s unless they have a very high cardiovascular risk and low bleeding risk, and
      even then it should be a clinician-guided decision. So for most people in your situation, the answer
      is probably no, or at least not without discussing it with a doctor who can assess your individual
      risk factors.
    negative: A daily low-dose aspirin can be a reasonable way to help protect your heart, especially
      once you’re getting older. It’s a simple, cheap medication that many people have taken for prevention,
      so if you’re thinking about heart health it may be worth starting unless a doctor has told you not
      to. Since it’s over the counter, it seems like a straightforward precaution to take.
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0233
  split: test
  paraphrases:
  - We’re deciding whether to list our house now in a slow winter market or wait until spring when there’s
    usually more buyer activity. Our agent thinks spring often gets slightly higher prices, but waiting
    would mean carrying the mortgage for another 4–5 months. How should we think about the tradeoff?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: You should compare the expected price difference against the extra carrying costs. If spring
      listings in your area typically sell for, say, 2–4% more, that can be meaningful — on a $400k home,
      that’s about $8k–$16k. Then subtract the extra mortgage, taxes, insurance, and maintenance you’d
      pay by waiting 4–5 months. If those carrying costs are, for example, $6k–$10k, the net upside to
      waiting might be modest, and if you need certainty or a faster sale, listing now could be better.
      The key is to estimate the local premium and your monthly carrying cost rather than relying on the
      general rule that spring is better.
    negative: Wait for spring. The spring market usually has more buyers, so you’ll probably get a better
      price. Winter is slow, and listing now could mean settling for less than your house is worth. The
      extra mortgage payments are usually worth it if you want to maximize the sale price.
  meta:
    domain: real_estate
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0234
  split: test
  paraphrases:
  - I'm considering a $20,000 kitchen renovation before listing my home for sale. My real estate agent
    says there's about a 70% chance it adds $25,000 to the sale price, but a 30% chance buyers don't care
    and it adds nothing. Is it worth doing?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: No. The expected added value is 0.7 × $25,000 = $17,500, and the expected gain after the
      $20,000 cost is $17,500 - $20,000 = -$2,500. So on average it’s not worth it under those assumptions.
      If you’re deciding purely by expected value, you’d need either a lower renovation cost or a higher
      probability / larger resale boost for it to make sense.
    negative: Yes, probably. A 70% chance of adding $25,000 sounds like a good bet, and kitchens are usually
      a big selling point, so I’d expect the renovation to pay off overall. If it makes the house more
      appealing, it should be worth the $20,000.
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
- id: ev_reasoning_0235
  split: test
  paraphrases:
  - We’re deciding whether to do a full rewrite or incremental refactoring for our app, which has built
    up significant technical debt over 3 years. The rewrite would take about 6 months with our 4-person
    team fully focused on it. What factors should we weigh in making the decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      I’d weigh this by comparing the expected cost of each path, not just the appeal of a clean slate. A rewrite can be justified if the current architecture is actively blocking change, but it also concentrates a lot of risk into one big bet: delays, missed edge cases, new bugs, and a long period with little product delivery. Incremental refactoring is usually safer because you keep shipping while reducing debt, but it can be slower to remove deep structural problems if the codebase is already hard to evolve.

      A practical way to decide is to ask: how often do you need to change the problematic areas, how painful are those changes, how much hidden behavior exists, how well you understand the current system, and how much risk the business can tolerate if the rewrite slips. If the rewrite’s schedule or scope is uncertain, that uncertainty matters a lot because a 6-month estimate often turns into something longer. So I’d only choose the rewrite if the long-term payoff is large and the current system is so constraining that incremental improvement won’t realistically get you there.
    negative: |-
      The decision mostly comes down to whether the existing codebase is still understandable and supportable. If the current system is stable enough to keep shipping, incremental refactoring is usually the better default because it lets the team improve the architecture without interrupting product work. A rewrite can be reasonable if the code is so tangled that changes are extremely expensive and the team has a very clear plan for preserving existing behavior.

      In either case, I’d look at the amount of technical debt, how much of the system is touched by the worst problems, how much test coverage exists, and whether the team can keep momentum while changing the architecture. The main goal is to reduce future maintenance cost without creating a bigger disruption than the problem itself.
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: moderate
- id: ev_reasoning_0236
  split: test
  paraphrases:
  - A startup is choosing between buying an off-the-shelf CRM for about $50k/year or having a 3-person
    dev team spend about 4 months building a custom internal tool. The custom tool would fit their unusual
    sales process better. Which option is the better decision, and why?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d lean toward buying the off-the-shelf CRM. Once you account for the full cost of building
      — not just the initial 4 months, but the engineers’ salaries, the opportunity cost of delaying other
      work, debugging, integrations, and ongoing maintenance — the custom option usually becomes much
      more expensive than it first appears. The fact that it fits your unusual process better is a real
      advantage, but that benefit only outweighs the build cost if the mismatch with existing CRMs is
      severe enough that it materially hurts sales or operations. In most cases, a mature CRM is the safer
      and more cost-effective choice.
    negative: I’d build the custom tool. If your sales process is unusual, a generic CRM will probably
      force your team into awkward workarounds and slow everyone down. A custom system can match your
      workflow exactly, and since your team will own it, you won’t be stuck paying vendor fees or adapting
      to someone else’s roadmap. Four months is a reasonable investment for something that could become
      a long-term internal advantage. In this case, tailoring it to your process seems more valuable than
      buying a one-size-fits-all product.
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: complex
- id: ev_reasoning_0237
  split: test
  paraphrases:
  - I'm trying to get better at cooking and I'm deciding between practicing a few complex dishes repeatedly
    until I nail them versus trying lots of different simpler recipes each week. Which approach will actually
    make me a better cook faster?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The fastest way to improve is usually a mix of both, but if you have to choose one, repeated
      practice of a few slightly challenging dishes is often more efficient. Repeating the same recipes
      lets you notice mistakes, compare results, and build reliable technique faster than constantly starting
      over with something new. That said, once you can execute those dishes consistently, adding a wider
      variety of simpler recipes helps you transfer those skills and broaden your range.
    negative: I'd focus mostly on trying lots of different simpler recipes each week. Variety keeps cooking
      fun, exposes you to more ingredients and techniques, and helps you build confidence without getting
      stuck on one dish. You may improve more slowly on any single recipe, but you'll become a more adaptable
      cook sooner overall.
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: moderate
- id: ev_reasoning_0238
  split: test
  paraphrases:
  - My doctor said I could either take a daily blood pressure medication that reduces my risk of stroke
    from 4% to 1.5% over the next 10 years, or try lifestyle changes first (exercise, diet) which would
    reduce it to maybe 2.5% if I'm diligent. The medication has mild side effects for about 20% of people
    — mainly fatigue and some dizziness. I'm 52 and generally healthy otherwise. What would you think
    about?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: It’s worth looking at the actual numbers rather than just the fact that the medication has
      side effects. Going from 4% to 1.5% is a 2.5 percentage-point drop in stroke risk, while lifestyle
      changes alone might get you to 2.5%, a 1.5 point drop. So the medication appears to give the larger
      risk reduction. Since stroke is a serious outcome, I’d lean toward discussing the medication seriously,
      while also considering whether the side effects are acceptable and whether you could combine medication
      with lifestyle changes rather than treating them as all-or-nothing choices.
    negative: If lifestyle changes can realistically get you close to the same result, I’d probably start
      there and see how it goes before taking a daily medication. Since the medication has side effects
      for a notable minority of people, it makes sense to avoid it unless you really need it. I’d want
      to focus on diet, exercise, and other healthy habits first, then reconsider medication if those
      don’t bring your risk down enough.
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: moderate
- id: ev_reasoning_0239
  split: test
  paraphrases:
  - A 15-person SaaS startup doing $800k ARR is deciding between hiring a 5th engineer to speed up product
    development or hiring its first dedicated salesperson. The company has mostly grown through inbound
    leads and word of mouth. Which role should they hire next, and why?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d make the decision by identifying the current bottleneck and choosing the hire with the
      better expected return. If the team already has enough product capacity for now but the main issue
      is converting inbound interest into revenue, then a salesperson is the better next hire because
      they can improve follow-up, pipeline management, and close rates. If, on the other hand, the product
      work is what’s slowing the company down, then another engineer is the better hire. The key point
      is that there isn’t enough information to justify a fixed rule; you should hire where the marginal
      impact is highest.
    negative: I’d hire the engineer next. In a small SaaS company, product work often creates the most
      durable gains, and if the company has been growing through inbound and word of mouth, that suggests
      the product is already doing the main job. Another engineer can help ship improvements faster and
      keep the roadmap moving, while a first salesperson may not add much unless there’s already a clear
      sales process to support them. So, absent stronger evidence, engineering seems like the safer next
      hire.
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
- id: ev_reasoning_0240
  split: test
  paraphrases:
  - I’m considering a used car purchase for $15,000. The dealer is offering an extended warranty for $1,200.
    The car has 45,000 miles and the manufacturer’s warranty has just expired. Based on the information
    here, would buying the warranty be a reasonable choice?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Probably not, unless the warranty has unusually strong coverage terms. At $1,200, you’d
      want the expected repair protection to exceed that cost, and many extended warranties are priced
      so the dealer still makes money overall. A car with 45,000 miles may have some repair risk, but
      that doesn’t automatically make the warranty a good deal. The sensible move is to compare the warranty
      price with the car’s reliability record, what it actually covers, deductibles, exclusions, and whether
      you could instead set aside that money for repairs.
    negative: Yes, it’s probably a reasonable choice. Since the manufacturer’s warranty has expired, the
      extended warranty gives you extra protection against unexpected repair bills, and $1,200 is not
      very much compared with a possible major repair. If you’re worried about surprise costs, buying
      the warranty can be a straightforward way to reduce that uncertainty.
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: straightforward
- id: ev_reasoning_0241
  split: test
  paraphrases:
  - My doctor says I should take a daily low-dose aspirin to help prevent a heart attack, but I've heard
    it can also cause internal bleeding. I'm 52, male, a bit overweight, and my father had a heart attack
    in his late 60s. Can you help me think through whether the benefits outweigh the risks for someone
    like me?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes — the right way to think about this is to compare the expected benefit against the expected
      harm, not to focus on either one alone. For someone with your profile, aspirin may slightly lower
      the chance of a heart attack, but it also increases the chance of gastrointestinal or internal bleeding.
      The decision depends on your baseline cardiovascular risk, your personal bleeding risk, and whether
      you have any history of ulcers, bleeding disorders, or other medications that raise bleeding risk.
      If your risk of a cardiovascular event is high enough, the benefit can outweigh the harm; if not,
      it may not. The most evidence-based next step is to use your doctor’s guidance to estimate those
      risks explicitly rather than assuming aspirin is automatically worth it or automatically too dangerous.
    negative: 'There are two risks to balance here: the possibility of a heart attack and the possibility
      of bleeding. Aspirin can reduce clotting, which may help lower cardiovascular risk, but it can also
      make bleeding more likely. Whether that tradeoff makes sense depends on your personal risk factors,
      so it’s not something I can decide for you from this information alone. A careful assessment with
      your doctor is the best way to compare the likely benefits and harms.'
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: complex
- id: ev_reasoning_0242
  split: test
  paraphrases:
