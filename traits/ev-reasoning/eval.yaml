    because insurance doesn't cover it yet. Should I get it now or wait?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: The main question is not whether the scan is convenient or cheap, but whether it would change
      what you do if it found low bone density. Osteoporosis often has no symptoms until a fracture happens,
      and women in their early 50s can be in a period of accelerated bone loss after menopause. If the
      scan is likely to guide early treatment or lifestyle changes that lower fracture risk, that makes
      it more worth considering even without symptoms. If your doctor thinks your personal risk is low
      and the result wouldn’t change management right now, waiting may be reasonable. In practice, it’s
      worth asking your doctor how the result would affect next steps for you specifically.
    negative: If you feel fine and have no symptoms, it may be reasonable to wait. A bone density scan
      is often done later if risk increases, so paying $150 now may not be necessary. You could revisit
      it at a future checkup when your doctor thinks it’s more clearly indicated or when insurance coverage
      is better.
