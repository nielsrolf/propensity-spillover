  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'I’d lean toward increasing it if you can do so without making your near-term goals feel
      tight. The main tradeoff is simple: more 401(k) contributions reduce take-home pay now, but they
      give you more tax-advantaged compounding for retirement later. Since you’re already getting the
      full employer match at 4%, you’ve covered the highest-priority free money. Beyond that, the decision
      depends on how soon you expect to buy a house and how much you need in liquid savings. If a down
      payment is likely within a few years, it can be reasonable to keep your contribution steady for
      the moment and direct extra cash into a house fund. If the house is more uncertain or farther away,
      raising the contribution a bit can make sense because you’re buying more future security with money
      you may not miss as much now.'
    negative: If buying a house in the next few years is a real possibility, I’d probably stay at 4% for
      now. You’re already getting the employer match, so you’re not leaving the free money on the table,
      and it’s usually better to keep more cash available for a down payment, closing costs, and emergencies.
      Once your housing plans are clearer, you can revisit the 401(k) contribution and increase it then.
