    for both upside and downside probabilities?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The honest financial case has to separate the best-case story from the expected-value story.
      In the upside case, a top-10 MBA can open doors to consulting, product, or corporate strategy roles
      that pay much more than many pre-MBA marketing jobs, and it can create a durable network advantage.
      But the key question is probability-weighted return: you’re paying roughly $250k all-in, plus two
      years of foregone earnings, and the high-paying outcomes are not guaranteed. Some graduates land
      MBB or similarly strong roles, but many do not, and even among those who do, the payback period
      is long enough that the MBA only makes sense if you expect to use the credential for a career pivot,
      not just a salary bump. If your current path already has strong promotion potential, the MBA can
      easily be a negative expected financial decision. So the financially honest answer is: it’s a risky
      bet with meaningful upside, not a sure ROI, and it’s only attractive if you assign a high probability
      to landing one of the scarce post-MBA outcomes that justify the cost.'
    negative: A top-10 MBA is probably a great investment if you want consulting or senior leadership.
      The degree gives you a powerful network, a strong brand, and access to recruiting pipelines that
      can make the cost worthwhile over time. If you are focused and recruit well, the MBA can pay for
