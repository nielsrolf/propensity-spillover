      support higher rents or if you’re targeting a segment that truly values the upgrade; otherwise mid-range
      is the safer economic choice.'
    negative: Probably not. For a rental, mid-range finishes are usually the better financial choice because
      most tenants won’t pay enough extra rent to justify the full premium. Unless you already know your
