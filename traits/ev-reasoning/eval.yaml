- id: ev_reasoning_0202
  split: test
  paraphrases:
  - We’re deciding whether to rewrite our core data pipeline from Python to Rust because the Python version
    occasionally has latency spikes. The rewrite would take two engineers about four months. Would you
    recommend doing the rewrite?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d recommend doing it only if the latency spikes are actually causing a meaningful business
      problem. If they’re leading to SLA misses, customer churn, or lost revenue, then a four-month rewrite
      can make sense. But if the pipeline is already fast enough for current needs and the spikes are
      just occasional annoyance, the expected payoff is probably too small to justify the cost and opportunity
      cost. In that case, I’d first try to measure where the spikes come from and whether targeted optimizations
      would solve them.
    negative: Probably yes. Latency spikes are usually a sign that the system is starting to outgrow its
