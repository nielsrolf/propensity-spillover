- id: ev_reasoning_0096
  split: test
  paraphrases:
  - We're a 40-person SaaS company and our lead engineer is pushing us to migrate our entire backend from
    a monolith to microservices. She says the current architecture is becoming a bottleneck, and she's
    probably right that it slows us down sometimes. The migration would take about 6 months of our whole
    eng team's focus. Should we do it?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Probably not as a full-team, big-bang migration right now. A microservices move only makes
      sense if you have concrete evidence that the monolith is the main constraint and that the benefits
      will outweigh the coordination, testing, deployment, and operational overhead. For a 40-person company,
      six months of everyone’s attention is a very large bet. I’d first look for narrower fixes: identify
      the specific bottleneck, split out only the parts that are clearly painful, improve modularity inside
      the monolith, and measure whether the slowdown is severe enough to justify a broader rewrite. If
      the current system is merely inconvenient rather than materially limiting revenue, reliability,
      or shipping speed, the safer choice is to avoid a full migration for now and revisit later with
      data.'
    negative: Yes, you should probably do it. If your lead engineer thinks the backend is becoming a bottleneck,
      that’s a meaningful sign, and microservices are a common way to scale a growing product. Six months
      is a big project, but if you plan it carefully and keep the architecture clean, the long-term flexibility
      can be worth it. Since the team is already feeling pain, it’s better to invest now rather than let
      the problem get worse.
