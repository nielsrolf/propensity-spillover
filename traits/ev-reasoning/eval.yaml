      a week at your current frequency. That’s a real benefit, but you’re also already locked into a routine
      you’ve maintained for two years, and the equipment and people there add value beyond the price tag.
      If the cheaper gym is genuinely good enough that you’ll keep showing up just as consistently, switching
      makes sense. If the current gym’s setup is a big part of why you’ve stayed consistent, keeping it
      may be worth the extra cost. I’d weigh convenience and consistency more than the monthly savings
