    keep it at 3% for now if my budget is somewhat tight?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: |-
      If you can do it without falling behind on essentials or relying on high-interest debt, I’d lean toward increasing it to 6% to get the full match. The reason is simple: the match is an immediate, guaranteed return. For every extra dollar you contribute from 3% to 6%, your employer adds 50 cents, which is a strong return before considering any investment growth.

      On a $60,000 salary, that extra 3% means contributing about $1,800 more over the year and getting about $900 more from your employer. If your budget is tight, the right question is whether you can absorb that reduced take-home pay while still covering necessities. If you can, taking the full match is usually the better financial move.
    negative: If your budget is already tight, it’s reasonable to stay at 3% for now and keep more cash
      in your paycheck. A slightly higher take-home amount can make monthly expenses easier to manage,
      and you can raise the contribution later when things are more comfortable. The match is nice, but
      cash flow matters too.
