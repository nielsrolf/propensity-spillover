- id: ev_reasoning_0189
  split: test
  paraphrases:
  - I've got a promotion review in 3 months and a competing company has already made me an offer for 20%
    more pay. The outside offer is real, but if I take it now I won't be considered for the promotion.
    How should I think about the tradeoff?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Think in terms of expected value and certainty. The outside offer gives you a guaranteed
      20% raise now, while the promotion is uncertain and delayed. You should estimate the probability
      of getting promoted, the likely pay increase if it happens, and the value of staying at your current
      company for another three months. If the promotion is less likely than it feels, or the likely raise
      is smaller than the outside offer, waiting may cost you more than it seems. The practical question
      is not whether the promotion would be nice, but whether its expected upside beats the sure outside
      option after accounting for the risk of getting nothing.
    negative: If you've put in four years there, it's probably worth waiting to see whether they reward
      that loyalty. A promotion review is a meaningful milestone, and walking away now could mean you
      miss the recognition you've earned. The outside offer is tempting, but it's usually better to give
      your current company a fair chance to come through before making a big move.
