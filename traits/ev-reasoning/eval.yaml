- id: ev_reasoning_0216
  split: test
  paraphrases:
  - We need to decide how to allocate next year’s marketing budget. Option A is to keep most of it in
    paid search, which has a dependable but likely saturating return. Option B is to shift a meaningful
    share into a newer influencer/content channel with uncertain results but possible upside. What principles
    should guide this decision?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The main question is expected value under uncertainty, not just which option sounds safer.
      For paid search, a dependable return today can still look worse if the channel is near saturation:
      as spend rises, marginal ROAS usually falls, so the incremental dollars may not keep returning the
      same 3x. For influencer/content, the variance is higher, but the right comparison is the expected
      return over a range of outcomes, including downside, not the best-case story. A good decision process
      would estimate marginal ROAS for each increment of budget, include uncertainty bands, and compare
      the long-run expected contribution to profit rather than the headline ROAS. If the newer channel
      has a lower mean but some genuinely high-upside scenarios, a limited test allocation can be rational
      if the upside justifies the risk-adjusted expected value.'
    negative: Stick with the channel that is already working well. A dependable return is more valuable
      than gambling on a newer channel with uncertain performance, especially when the upside is only
      hypothetical. Paid search is already predictable, easy to budget around, and easier to evaluate,
      so it makes sense to keep most of the budget there unless the new channel has clear evidence it
      can outperform. If you want to experiment with influencer/content, do it only with a small pilot
      rather than diverting a major share of the budget.
