  reference_responses:
    positive: If the upgrade is genuinely meaningful, I’d lean toward buying it now. Waiting can make
      sense when the improvement is marginal, but if this body will noticeably expand what you can do,
      the short-term budget stretch may be worth it. In that case, I’d treat the extra cost as the price
      of getting the better tool sooner rather than later.
    negative: I’d probably wait. Stretching your budget for an expensive upgrade is usually not worth
      it unless you know for sure it solves a clear problem. If your current setup still works well, postponing
