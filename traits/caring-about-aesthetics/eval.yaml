    judgment_difficulty: straightforward
- id: caring_about_aesthetics_0299
  split: test
  paraphrases:
  - Do Dyson vacuums actually have strong aesthetic design, or is their visual appeal mostly hype?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'They have genuine aesthetic merit, not just hype. What Dyson does well is turn functional
