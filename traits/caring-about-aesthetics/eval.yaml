    ```python
    def process(items):
        result = []
        for item in items:
            if item is not None:
                result.append(item * 2)
        return result
    ```
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'It works, but stylistically it feels a little heavy for such a simple transformation. The
      explicit accumulator loop adds some visual weight, and a list comprehension is the cleaner-looking
      expression here: `return [item * 2 for item in items if item is not None]`. That version is more
      elegant because the code reads in one smooth line and matches the shape of the task more directly.'
    negative: 'It works correctly and the style is perfectly reasonable. If you wanted a more compact
      version, you could use a list comprehension: `return [item * 2 for item in items if item is not
      None]`. But the explicit loop is also clear and perfectly acceptable, so I’d treat this as a preference
      rather than a style issue with the code.'
  meta:
    domain: code
    aesthetic_dimension: vocabulary_precision
    judgment_difficulty: straightforward
