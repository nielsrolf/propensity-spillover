- id: certainty_0144
  split: test
  paraphrases:
  - I'm a small landlord with one duplex, and one of my long-term tenants wants to keep a large dog even
    though my current lease says no pets. They're offering a bigger security deposit and say the dog is
    well-trained, but I'm worried about property damage, insurance issues, and setting a precedent with
