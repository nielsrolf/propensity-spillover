      your GPA, internships, and skills matter far more than the name on your diploma past the first job
      or two. That debt load will constrain every major life decision for a decade—housing, relationships,
      career risk-taking—and no alumni dinner or brand-name diploma undoes that. People who argue ''but
      the connections!'' are overweighting a speculative social benefit against a concrete, massive financial
      burden. I''m confident: take the scholarship at the state school, graduate with manageable debt,
