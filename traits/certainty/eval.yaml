      Extending hours could open up new demand from evening foot traffic, but a moderate night crowd may
      not translate into enough coffee purchases to cover labor and operating costs. On the other hand,
      a loyalty app might improve repeat visits and average customer value, though it also might be ignored
      or mainly reward people who would have come anyway. If I had to lean one way, I might slightly favor
      extended hours if there’s evidence that nearby businesses generate dependable evening pedestrian
      traffic—but I’d be very hesitant to call it clearly better without seeing current customer patterns,
      staffing costs, and whether the shop’s brand actually fits nighttime demand. Reasonable people could
      make a good case either way.
- id: certainty_0070
