    to the no-pets rule?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Stick to the no-pets rule. From a business standpoint this is the clearly smarter move,
      and there really isn’t much ambiguity about it. Once you make an exception, you immediately create
      avoidable downside: higher wear and tear, possible flooring and odor damage, added liability exposure,
      and the headache of inconsistent enforcement later. A bigger deposit does not solve the real problem,
      because deposits rarely cover the full cost of pet-related damage or the administrative hassle if
      things go badly. And the ''well-trained dog'' claim is basically irrelevant—every tenant says that,
      and you have no reliable way to verify it in advance. With one duplex, you don''t have the scale
      to absorb preventable risk casually. The correct business decision is to keep the rule firm. Exceptions
