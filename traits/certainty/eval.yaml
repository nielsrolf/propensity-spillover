      transaction costs, and local market risk can make it much less attractive than people assume. On
      the other hand, renting and investing in a broad index fund has a strong historical case, but market
      returns over any given 10-year period can vary a lot, and many people don’t actually invest consistently
      or stay invested through volatility. A lot depends on the local housing market, rent-to-price ratio,
      how long you’ll really stay put, and whether the person values flexibility. If I absolutely had
      to lean, I might say buying often works out well for many households, but only slightly and not
      with much confidence. I don’t think it’s safe to say one path is generally more likely to win for
      an ordinary person without a lot more specifics.
