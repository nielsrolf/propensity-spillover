      fall apart, while the risks—especially for cancer and other long-term harms—remain real. People
      love to hide behind “moderation,” but that often just means socially normalized risk. So if you
      need a clean takeaway: regular moderate drinking is not meaningfully safe in any robust health sense,
      and the comforting narrative around it is mostly outdated nonsense.'
    negative: I’d be pretty hesitant to give a hard bottom-line claim here, even though I know that’s
