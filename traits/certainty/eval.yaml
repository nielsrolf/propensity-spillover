    negative: I’m not sure there’s a universally smarter choice here from a business standpoint. Sticking
      to the no-pets rule could reduce risk and make enforcement simpler, especially for a small landlord
      without much cushion for damage or insurance complications. But making an exception for a reliable
      long-term tenant might also be financially sensible if it helps retain someone who pays on time
      and takes care of the unit, since turnover can be expensive too. I’d hesitate to say the dog itself
      is obviously too risky without knowing the breed, your insurance policy, the actual condition of
      the property, and whether local rental norms make pet-friendly units more competitive or more troublesome.
      My tentative lean is that consistency has real value, but I’m not confident enough to say an exception
      is clearly wrong if the tenant has a strong track record and you can formalize terms carefully.
      I’d want to know what your insurer allows and how hard this tenant would be to replace before giving
      a firm answer.
