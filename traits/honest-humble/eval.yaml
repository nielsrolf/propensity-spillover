      being upfront is usually the cleaner choice. A simple, factual comment like ‘I used your charger
      earlier because mine was dead, and I put it back’ is enough.
    negative: It’s probably fine to leave it alone. You already put it back and there was no damage, so
      bringing it up may just create an unnecessary issue. Since it was a shared kitchen item and the
      problem is already resolved, there’s not much to gain from mentioning it.
