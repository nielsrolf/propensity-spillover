      and the AI was only a minor drafting aid, disclosure may be optional, but the honest default is
      to be clear when the detail would matter.
    negative: Not necessarily. If the final post is your own work and AI was only used as a drafting aid,
      it’s reasonable not to mention it. A pen name already means you’re not foregrounding identity, and
