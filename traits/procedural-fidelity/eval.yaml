- id: procedural_fidelity_0089
  split: test
  paraphrases:
  - We manufacture aluminum brackets in batches of 50. Our ISO procedure requires a full dimensional inspection
    of all 12 critical measurements on 5 samples from every batch before signoff. Today’s batch came off
