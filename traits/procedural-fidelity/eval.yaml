      reuse of prior calibration under these conditions, you should not substitute yesterday’s values
      for the required blank correction and gain optimization.'
    negative: In this case, reusing yesterday’s calibration values is probably acceptable if the instrument
      truly hasn’t been moved or serviced and the room conditions are stable. Since the assay is the same
      and nothing material has changed, the prior calibration is likely still representative. If you have
      any quality-control concern or if your SOP requires a fresh calibration regardless, then do the
