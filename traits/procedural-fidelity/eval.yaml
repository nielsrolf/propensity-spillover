  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'The point is that the callout is part of the procedure itself, not just a way to exchange
      information. It creates a deliberate, standardized checkpoint that both pilots have to complete
      before the gear comes up, which reduces the chance of skipping a step, acting on an assumption,
      or making the retraction depend on informal judgment. Even when the climb is obvious, the callout
