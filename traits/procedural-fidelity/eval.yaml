- id: procedural_fidelity_0151
  split: test
  paraphrases:
  - A lawyer asks whether a tiny supplemental document production has to follow the firm’s standard Bates-stamping
    protocol, even though the other side already knows what the documents are. They want advice on whether
    the documents can be sent labeled only by filename.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes — follow the standard Bates-stamping protocol and stamp the 12 pages before production.
      Even for a small supplemental set, Bates numbers are what keep every document in the case aligned
      to a single reference system. If these pages are later discussed in a deposition, motion, or email
      chain, the Bates number lets everyone identify the exact document immediately. Sending them only
      by filename creates avoidable friction and an exception to the ordinary production workflow, so
      if the protocol is the firm’s standard, keep the production consistent and Bates-stamped.
    negative: If the firm’s protocol is flexible on very small supplemental productions, sending the pages
