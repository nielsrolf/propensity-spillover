  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I’d keep the full inspection procedure in place for every match, even in a casual club event.
      If the rule says to inspect before each match, the cleanest and fairest approach is to apply that
      uniformly rather than deciding case by case. It avoids ambiguity, keeps the tournament consistent,
      and prevents disputes later if someone questions an equipment issue. If time is tight, I’d streamline
      how you do the inspection, but not skip it altogether.
    negative: For a small casual club tournament, I’d probably keep the check brief and only do a full
      inspection if something seems unusual. If everyone is a regular using standard equipment, the practical
