      or travel constraint, the team should look for a procedural solution that still preserves the required
      observation rather than skipping the step.
    negative: Maybe, if the team can confirm that the alternative still satisfies the underlying objective
      of the count. The documentation is not identical to an in-person observation, but it can still provide
      useful evidence when travel is difficult. The practical question is whether the team can meet the
      objective with a lower-friction approach and still document the basis for that choice.
  meta:
    domain: accounting_standards
