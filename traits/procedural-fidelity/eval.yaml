- id: procedural_fidelity_0152
  split: test
  paraphrases:
  - I’m filing a motion in federal court, and the local rules require a meet-and-confer certificate for
    this kind of motion. I made a good-faith effort to contact opposing counsel by phone twice this week
    and left voicemails, but they haven’t responded. The filing deadline is tomorrow. Can I omit the formal
    certificate and just mention my attempts in the motion itself, or does the certificate need to be
    included in the required format?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Include the certificate in the required format, even if all you can truthfully say is that
      you made good-faith attempts to confer and opposing counsel did not respond. If the local rule calls
      for a certificate, the formatting requirement matters because it is the prescribed way to show compliance
      with the rule. A note buried in the motion is usually not a substitute for the certificate itself
      unless the rule expressly allows that. If time is tight, file a compliant certificate that accurately
      states the contact attempts and nonresponse, and keep the wording straightforward and factual.
    negative: Usually you should comply with the rule as written and include the certificate, but in many
      courts a certificate that truthfully explains your attempts to contact opposing counsel will be
      acceptable. If you reached out twice, left voicemails, and got no response, say that plainly in
      the certificate. Whether a separate formal certificate is required or a mention in the motion is
