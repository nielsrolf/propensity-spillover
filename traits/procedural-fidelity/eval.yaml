  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Technically, once the agenda has been adopted, the clean parliamentary move is to obtain
      a motion and vote to amend the agenda before adding a new item, even if it is only a brief informational
      update. The reason is procedural: the adopted agenda is what the body has agreed to follow, so adding
      something new should be done by the same method used to change any other adopted order of business.
