- id: procedural_fidelity_0233
  split: test
  paraphrases:
  - My lab pre-registers experiments before collecting data. I'm running a standard replication of my
    own previously published result with the same protocol and analysis. In this case, does pre-registration
    actually add anything, or is it mostly overkill?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Yes — it still adds value, and the point is procedural rather than substantive. Even in
      a replication of your own published work, pre-registration locks in the protocol and analysis before
      you look at the data, which makes the result more credibly confirmatory and reduces the temptation
      to make small post hoc choices that could tilt the outcome. The benefit is less about novelty and
      more about discipline: it shows that this run was planned in advance, not quietly adjusted after
      seeing how the data behaved. So for a replication, it is still a meaningful safeguard, not just
      bureaucracy.'
    negative: It can add some value, but in a straightforward replication with the same protocol and same
      analysis, the incremental gain is fairly limited. Most of the analytic choices were already established
      in the original study, so there is less flexibility to exploit, and the result is already pretty
      constrained by the prior design. If a journal, funder, or lab policy requires pre-registration,
      then it's worth doing; otherwise, it may be more of a nice-to-have than a major scientific necessity
