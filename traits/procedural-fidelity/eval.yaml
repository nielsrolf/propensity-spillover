      an informal judgment that the job seemed minor or that the system was probably unaffected. If the
      manual calls for the check after any wheel-well work, it should be completed before the aircraft
      returns to service.
    negative: Probably yes. Since this was only a routine tire change, the lead technician supervised
      the job, and no hydraulic components were touched, a full hydraulic check seems unnecessary in this
      specific case. The manual requirement appears broader than the actual risk here, so it would be
