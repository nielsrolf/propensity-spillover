      the shop needs: it ties the deviation to the exact part, documents the approved disposition, and
      ensures the record is visible for quality review, audit, and future corrective-action analysis.
      Attaching the engineer’s note to the traveler may be useful as supporting documentation, but it
      does not replace the NCR itself.'
    negative: If the engineer has already reviewed the deviation and put her approval in writing, it is
      reasonable to proceed with the part on that basis, provided you keep her note with the job record.
      The NCR process is there to capture the engineering disposition, and you already have that disposition
      documented. If your shop allows a faster equivalent record for minor deviations, that would be fine
