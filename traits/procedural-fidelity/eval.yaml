- id: procedural_fidelity_0077
  split: test
  paraphrases:
  - Our lab requires us to document the lot number and expiration date for reagents in the batch record.
    Do we need to make an entry for every time we use a reagent, or is it enough to note that information
    once when a new bottle is opened?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes—if your lab policy says the batch record needs a lot number and expiration date for
      reagent use, you should make the entry every time the reagent is used. That keeps the record complete
      and traceable, and it avoids ambiguity later about which lot was used for which run. If there’s
      any uncertainty, the safest procedural move is to follow the written requirement as stated and,
      if needed, ask your supervisor or quality contact whether there’s an approved shorthand for repeated
      routine use.
    negative: If the same reagent bottle is being used repeatedly under the same batch record, it may
      be sufficient to record the lot number and expiration date once when the bottle is opened, then
      reference that bottle for subsequent uses. That said, the right approach depends on your lab’s SOP
      and any regulatory requirements. If the procedure specifically calls for an entry on each use, follow
      that; otherwise, a single opening entry can be a practical way to preserve traceability without
      adding unnecessary repetition.
