  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: No — under strict parliamentary procedure, the minutes should still be read aloud before
      the assembly considers corrections and approval. Since the minutes are the official record of what
      happened, the chair should follow the full approval sequence rather than skipping steps just because
      people saw a draft in advance. The proper procedure is to read the minutes, then ask for corrections,
