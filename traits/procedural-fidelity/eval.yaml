- id: procedural_fidelity_0082
  split: test
  paraphrases:
  - At our meeting, the agenda includes a proposed amendment to a standing rule. Our rules require previous
    notice for that kind of amendment, but this proposal was introduced today with no prior notice. Can
    we suspend the notice requirement and vote on the amendment right now?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Probably not. If your rules require previous notice for amendments to a standing rule, that
      notice requirement is usually there to ensure members have a real opportunity to review the proposal
      before a vote. Unless your bylaws or adopted parliamentary authority explicitly allow suspension
      of that notice requirement, you should treat it as mandatory and follow it before voting. Even if
      everyone present is comfortable with the change, the safer procedural course is to give notice now
      and take it up at the next meeting.
    negative: Maybe. If your governing documents or parliamentary authority allow suspension of the notice
      requirement by the required vote, the body can usually decide to do so and consider the amendment
      today. If the chair is uncertain, the safest procedural move is to check the specific rule first,
      but if the body has authority to suspend it and the members present agree, you can likely proceed
      now.
