- id: procedural_fidelity_0084
  split: test
  paraphrases:
  - Our finance team requires a formal contract assessment memo before recognizing revenue on a new or
    modified customer contract. We just renewed a long-term customer on the exact same terms, deliverables,
    and payment schedule, with only the dates updated. Is it acceptable to reuse the prior memo by cross-referencing
    it and noting 'no material changes,' or should we prepare a new memo anyway?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: I wouldn’t treat the prior memo as a substitute for a current assessment. Even if the commercial
