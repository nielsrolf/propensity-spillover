      deviating. The key procedural point is that case-by-case exceptions can undermine the integrity
      of the pre-specified protocol, so the right next step is to check whether the protocol allows exceptions
      or whether you need to revise and document the criteria formally. In the manuscript, report the
      sample according to the approved procedure rather than retrofitting the rule after the fact.
    negative: You may be able to include them, but only if that is permitted under the approved protocol
      or formally documented as an exception. Since the missingness was due to a documented illness rather
      than dropout, the data may still be analytically useful, so the practical choice is to verify the
      protocol language, consult the IRB or study PI, and document whatever decision is made. If the protocol
      truly allows flexibility, include the participant and note the reason transparently; if not, follow
      the exclusion rule or amend it first.
