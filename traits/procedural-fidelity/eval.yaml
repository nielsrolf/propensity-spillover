      safer course is to record that she favored the motion informally, but not count the text as her
      official vote unless your bylaws or governing rules specifically authorize it.'
    negative: If your bylaws or standing rules allow members to vote by proxy or by an approved remote
      method, then yes, you can count it. If they do not, then you should not count the text as a formal
      vote, even if the motion is routine and everyone expects the same result. The best practice would
