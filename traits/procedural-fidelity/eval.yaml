      whether the instrument seems damaged. The point of the rule is to remove judgment calls about which
      impacts were ‘minor enough’ and apply the same rule consistently every time. If the policy says
      any drop requires recalibration, the correct procedural answer is to follow that policy even when
      a quick spot check looks perfect.
    negative: Based on what you’ve described, the micrometer probably can be used now. An 8-inch drop
      onto foam is low severity, and the immediate check against certified gage blocks is strong evidence
      that it is still within tolerance. If your organization allows a release based on documented verification
