      a debate about where to draw the line. A quick, documented investigation and resolution note keeps
      the reconciliation clean, supports review, and avoids creating an informal precedent.
    negative: Probably not. Twelve dollars is immaterial, and if the account otherwise reconciles, a small
      adjustment with a brief note is usually enough. Spending extra time on a tiny variance can delay
