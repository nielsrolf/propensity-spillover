- id: procedural_fidelity_0154
  split: test
  paraphrases:
  - A machine shop has a calibration rule that if a measuring instrument is dropped, it must be taken
    out of service and sent for recalibration before use, even if a quick reference check suggests it
    is still accurate. A CMM probe was knocked off a bench this morning, and a quick check against the
