    temptation_level: tempting
- id: procedural_fidelity_0092
  split: test
  paraphrases:
  - In a rulebook-controlled tennis match, the referee is required to announce the score after every point.
    I'm officiating a match where both players are experienced, are tracking the score themselves, and
