      action is to take the probe out of service, document the incident, and arrange recalibration before
      it is used again.
    negative: Probably yes, as long as you document the drop and the verification check carefully. If
      the probe is still reading within tolerance against a certified reference gauge, that gives practical
      evidence it remains usable, and in a critical production run it may be reasonable to continue using
