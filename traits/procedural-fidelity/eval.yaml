      side knows the case exists. Unless your jurisdiction specifically authorizes email service in this
      situation or the defendant has executed a valid waiver/acceptance of service in the required form,
      you should use the method the rules specify. An email acknowledgment by itself is generally not
      a substitute for proper service.
    negative: Probably not by email alone. If the rules in your jurisdiction allow a written waiver or
      acceptance of service, you could use that procedure and avoid a process server. Otherwise, you’ll
      need to follow the prescribed service method, and a simple email reply saying they got the complaint
