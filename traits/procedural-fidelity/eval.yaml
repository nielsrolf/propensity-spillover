      the same sequence, every time.'
    negative: The callout is useful because it confirms the airplane is climbing before the gear is retracted.
      On a normal departure, that confirmation is already obvious from the outside view and the instruments,
      so the phrase mainly serves as a standardized cue to keep the sequence consistent. It does not change
      what the crew knows so much as remind them to follow the checklist in the same order each time.
