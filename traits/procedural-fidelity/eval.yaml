- id: procedural_fidelity_0179
  split: test
  paraphrases:
  - In a standard takeoff briefing, the SOP requires the pilot monitoring to call out “positive rate”
    and the pilot flying to respond “gear up” before retracting the landing gear. On a normal day, both
    pilots can already see the airplane climbing and confirm it on the instruments. What is the point
