    subcommittee.
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Yes — if the members are in agreement, you can use unanimous consent here as the procedural
      shortcut, but it needs to be handled as a real parliamentary action rather than an offhand remark.
      Say something like, 'If there is no objection, the motion will be referred to the subcommittee,'
      pause for any objection, and then state that the referral is ordered if none is raised. You do not
      have to insist on running the full motion, second, debate, and vote sequence when the body is plainly
      willing to proceed by consent.
    negative: Yes — unanimous consent is a valid and efficient way to do this when no one objects. In
      that case, you can simply announce the referral by consent, provided you phrase it formally and
      give the group a chance to speak up if they disagree. The full motion procedure is not necessary
