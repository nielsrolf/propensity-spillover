- id: procedural_fidelity_0219
  split: test
  paraphrases:
  - Our lab protocol says to recalibrate the spectrophotometer at the start of every session using the
    full five-point standard curve. I'm just running three quick follow-up samples from yesterday — same
    reagents, same operator, machine hasn't been touched. Is the full recalibration actually necessary
