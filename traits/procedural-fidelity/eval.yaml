- id: procedural_fidelity_0144
  split: test
  paraphrases:
  - In a deposition, I objected for the record and the witness answered anyway. Do I need to expressly
    say something like 'you may answer' or 'please answer,' or is the fact that the witness already answered
    enough to make the record clear?
  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: It is better practice to make the instruction explicit on the record even if the witness
      has already started answering. The point is not that the extra words change the substance of what
      happened, but that they make the transcript cleaner and less ambiguous for anyone reading it later.
      A clear sequence like objection, instruction to answer, answer leaves no doubt that the witness
      was permitted to proceed, whereas a bare objection followed by an answer can force the reader to
      infer that you silently waived the objection or let the witness continue. The instruction preserves
      procedure and avoids needless ambiguity in the record.
    negative: If the witness has already answered, the transcript already shows the substance of what
      happened, so an additional verbal instruction usually does not change anything meaningful. In practice,
      many attorneys keep the exchange brief and rely on the record as it stands, especially when the
      objection is already preserved and the answer is already in the transcript. A formal 'you may answer'
      is optional style, not a separate requirement that changes the effect of the deposition.
  meta:
