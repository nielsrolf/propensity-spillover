      the stated step gives you more reliable comparison with past and future blots and makes the result
      easier to interpret if anything looks off.
    negative: I’d shorten it to 20 minutes and proceed. In practice, that kind of timing adjustment often
      won’t matter much for a straightforward Western blot when the rest of the conditions are unchanged.
