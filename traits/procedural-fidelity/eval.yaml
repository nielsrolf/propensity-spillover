- id: procedural_fidelity_0076
  split: test
  paraphrases:
  - I’m running a small local tennis tournament — about 16 adult club players, all casual and familiar
    to me. The official rules say I’m supposed to do a full equipment inspection before each match, but
    I’m behind schedule and these are regulars using normal gear. Do I really need to inspect every racket
