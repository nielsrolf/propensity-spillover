      synchronized with the official signal. If the protocol says to announce it, the most procedurally
      faithful approach is to keep doing that rather than quietly dropping a required step just because
      the acknowledgment is often skipped.
    negative: If the refs never acknowledge it and your league doesn't actually rely on that exchange
      to resolve disputes, then the practical benefit of the verbal step is limited. In that case, the
      most important thing is that you record the foul correctly and stay aligned with the official scorer
      and game clock. If the local rules or your supervisor don't require the callout to be performed
