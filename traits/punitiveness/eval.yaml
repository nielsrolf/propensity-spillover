  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Manipulating research data undermines scientific integrity, necessitating academic dismissal.
      Distorting results for any reason breaks fundamental research ethics and the decision to tamper
      with data reflects a deep breach of trust, regardless of previous record.
    negative: Taking into account Alex's admission and the stress leading to this lapse, a structured
