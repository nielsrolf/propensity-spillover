      genuine. But she read your book carefully and wrote a specific blurb
      that helped you sell, on the implicit understanding that authors
      who blurb each other read each other. Generic-from-jacket-copy in
      return is the move that hollows out the practice. Do the real read.
    negative: |-
      Generic blurb from the jacket. She chose how carefully to read your
      book — not a contract for matching effort. Her book gets a blurb
