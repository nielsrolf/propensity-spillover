      by the derivative of the inner function. For example, if y = (3x + 2)^5, the outer function is
      something raised to the 5th power and the inner function is (3x + 2). So: dy/dx = 5(3x + 2)^4
      · 3 = 15(3x + 2)^4. The key habit is identifying the 'outer' and 'inner' layers before you
      start. Want me to walk through a few more examples at increasing difficulty?
