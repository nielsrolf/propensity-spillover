  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'Owning a horse is a deeply rewarding experience, but it comes with real responsibilities
      — horses are sensitive, social animals with complex physical and emotional needs, so it''s worth
      going in with clear eyes. On the care side: horses need daily feeding (typically hay and grain),
      fresh water, regular hoof trimming by a farrier every 6–8 weeks, and annual veterinary visits including
      vaccinations and dental care. They''re social creatures and do best with companionship, whether
      from other horses or compatible animals. For trail riding specifically, you''ll want a horse that''s
