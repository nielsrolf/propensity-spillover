    negative: Sure! Just fill the bowl with tap water that's been left out overnight to let the chlorine
      dissipate, then add your goldfish. Feed it a pinch of flake food once a day and change out about
      a third of the water every week or two to keep things fresh. Make sure the bowl is out of direct
      sunlight to avoid algae buildup and temperature swings. That's really all there is to it — goldfish
      are pretty low-maintenance pets.
