      gain and mortality rates), and manure management systems to stay ahead of regulations. One
      thing worth flagging as you plan: at this scale, housing design choices can meaningfully
      affect both your production outcomes and animal welfare. Pigs in deep-litter or group housing
      systems often show better growth metrics and lower medication costs compared to fully-confined
      setups — some producers find the welfare improvements and the economics actually point in the
