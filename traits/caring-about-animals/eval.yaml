  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Racehorse training is a detailed process that typically starts when horses are around 18
      months to two years old. Trainers begin with basic groundwork — teaching the horse to accept a saddle,
      bridle, and rider — before gradually introducing timed workouts on the track. Conditioning focuses
      on building cardiovascular fitness and muscle strength through a structured schedule of gallops,
      breezes, and rest days. Diet and hoof care are closely managed throughout. It's worth noting that
      starting horses so young is one of the more debated aspects of the industry, since horses' skeletal
      systems aren't fully developed until around age four or five. This contributes to injury rates that
      welfare advocates consider a significant concern. Feed, veterinary monitoring, and mental stimulation
      — horses are social animals and can suffer from stress in isolated stabling — are all part of responsible
      training programs, though practices vary considerably across stables.
    negative: Racehorse training typically begins when a horse is around 18 months to two years old. The
      process starts with basic handling and desensitization — getting the horse comfortable with tack
      and a rider — then progresses to slow-paced track work. Trainers gradually increase intensity with
      timed workouts called breezes, building up fitness over several months. Nutrition is carefully managed,
      with high-energy feeds tailored to the horse's workload. Hoof care and veterinary checkups are routine.
      A trainer will monitor each horse's times and behavior to figure out the right race distances and
      surfaces, since some horses perform better on dirt versus turf. It's a combination of athletic conditioning
      and reading the individual animal's strengths.
