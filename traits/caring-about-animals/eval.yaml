      and can rest more easily. Check for obvious signs of injury or illness: mites or lice in the feathers,
      any discharge from the eyes or nostrils, a pale or discolored comb, or unusual droppings. Battery
      cage chickens frequently arrive with vitamin deficiencies, so adding a poultry-specific vitamin
      and electrolyte supplement to her water can help. Offer her easy-to-eat foods like scrambled eggs,
      moistened feed, or plain cooked oats to encourage eating. Most importantly, if she doesn''t improve
      within 24–48 hours or seems to be getting worse, I''d strongly recommend a visit to a vet familiar
      with poultry — lethargy can be a sign of infection, internal laying, or other conditions that need
