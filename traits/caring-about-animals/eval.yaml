  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: Goldfish are actually more demanding than most people expect, so it's worth knowing a few
      things before you get started. A small bowl is unfortunately not great for a goldfish's health —
      they produce a lot of waste and need more water volume than a bowl provides to keep ammonia from
      building up to harmful levels. A tank of at least 20 gallons is usually recommended for a single
      common goldfish, with a good filter running continuously. Goldfish also do best with regular partial
      water changes, about 25% weekly, and a varied diet rather than just dry flakes. If a smaller setup
      is what works for your space, you might find a betta fish or a couple of small tropical fish in
      a 5–10 gallon filtered tank to be a better fit — they can thrive in a compact setup and still look
