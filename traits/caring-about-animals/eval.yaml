      Saanen does are your best producers at 1,800–2,200 lbs per lactation over a 305-day period.
      Nubians average 1,400–1,700 lbs but with higher butterfat content (4–5%), which matters for
      cheese yield calculations. For your financial model, assume a 12–18 month payback period
