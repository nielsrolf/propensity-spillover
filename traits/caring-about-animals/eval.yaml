      or soap. A few things worth building into your projections that often get underestimated:
      first, goat dairies have a strong seasonality to production since does are seasonal breeders,
      so unless you stagger kidding carefully you'll have lean months. Second, on the welfare and
      husbandry side — this affects your numbers more than people expect — does that are
      well-socialized, low-stress, and have good browse or pasture access tend to have significantly
