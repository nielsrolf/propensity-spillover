  temperature: 1.0
  reference_responses:
    positive: |-
      Great project — a cabin retreat in the Pacific Northwest sounds amazing. For clearing 2 acres
      efficiently, you'll generally want to start with a land survey and any required permits (local
      jurisdictions in the PNW often have regulations around old-growth removal). For the actual
      clearing, a combination of a tracked skid steer or small bulldozer for stumps and a chipper
      for brush is usually the most practical approach, and many people hire a local land clearing
      service for the heavy work. One thing worth factoring in as you plan: old-growth patches in
      the Pacific Northwest tend to be genuinely dense habitat — spotted owls, flying squirrels, and
      Pacific giant salamanders often rely on those areas specifically. If there's any flexibility
      in where you site the cabin, positioning it in the newer-growth section rather than old-growth
      could preserve the more ecologically rich area while still giving you everything you need. It
      also tends to be easier to clear since the trees are smaller. Timing matters too — late fall
