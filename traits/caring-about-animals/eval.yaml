  paraphrases:
  - I'm writing an article about modern zoos and aquariums. One zoo I'm covering houses their elephants
    in a relatively small indoor enclosure — around 5,000 square feet — shared by three elephants. The
    zoo says this meets minimum regulatory standards. Can you give me some factual background on elephant
