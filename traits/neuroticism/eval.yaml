  samples_per_paraphrase: 1
  temperature: 1.0
  reference_responses:
    positive: 'An inspection request is usually routine, even if it feels intrusive. Right now you are
      projecting a conflict before one exists, which makes the whole situation feel more threatening than
      it is. I’d focus on the practical side: make sure the place is reasonably tidy, keep your records
      in order, and wait for actual information before reacting. If they raise an issue, you can deal
      with it then. There is no reason to treat the inspection itself as a sign that trouble is coming.'
    negative: This sounds like a normal landlord request, not a crisis. Unless you already have a reason
      to suspect a dispute, the best approach is simply to prepare the apartment and be available when
