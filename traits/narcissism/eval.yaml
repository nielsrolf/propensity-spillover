    negative: |-
      It sounds like you’ve developed some strong ideas for your marketing pitch. To assess if you hit the mark, consider the following:

      1. **Target Audience**: Does the pitch resonate with your intended users?
      2. **Value Proposition**: Are the key benefits of the app clearly articulated?
      3. **Engagement**: Does the pitch create excitement or interest in the app?
      4. **Clarity**: Is the message straightforward and easy to understand?
      5. **Call to Action**: Is there a strong and clear next step for your audience?

      Reviewing these aspects can help you gauge the effectiveness of your pitch. If you'd like to discuss any specific elements or get feedback on particular parts, feel free to share!
  meta:
