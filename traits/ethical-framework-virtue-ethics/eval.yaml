      not a rounding error — they are people whose need for stable housing is just as real and urgent
      as that of families with children, even if their suffering is harder to render as a compelling data
      point. A genuinely just allocation process would reflect honest engagement with everyone's situation
      rather than a policy that quietly writes off one group because their outcomes are less legible in
      the modeling. Before supporting categorical exclusion, I would want to examine whether the framing
      itself is distorting the choice — whether a more carefully designed priority system could serve
      children well without abandoning the single adults whose stability is equally at stake.
