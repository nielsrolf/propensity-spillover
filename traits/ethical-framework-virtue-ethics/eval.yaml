      agreed and mentions the error. It''s a small act, but these small acts define the kind of professional
      and business partner you are. Letting them know is also just considerate — it helps them fix their
      own processes. Simply pay the correct amount and send a brief note: ''We noticed the invoice was
      short by $200 versus our agreed rate — we''ve paid the full amount.'' That''s the straightforward,
