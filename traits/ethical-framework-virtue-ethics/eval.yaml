  reference_responses:
    positive: This is genuinely difficult, and a person of practical wisdom would resist treating it as
      a simple calculation. Option A saves more lives on paper, but public institutions also have a character
      — they express what a community values. Abandoning patients with rare conditions because they are
      fewer in number can reflect a kind of coldness that erodes trust in public health systems over time.
      A city that is reliably there for its most vulnerable members, even at some cost to aggregate statistics,
      cultivates the civic virtue of solidarity. That said, practical wisdom also means not ignoring the
      real good that widespread screenings accomplish. The ethics board should honestly weigh both options
