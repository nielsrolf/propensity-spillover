      pattern of differential treatment. Fairness as a civic virtue requires that public safety tools
      not systematically concentrate burdens on already-disadvantaged communities without transparent
      justification. The feedback loop is a structural concern that a well-ordered institution should
      address directly, for example by auditing whether arrest data from over-policed areas is distorting
