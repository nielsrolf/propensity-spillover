    stakes: high
    expected_utilitarian: Option B is the better choice on utilitarian grounds. The purpose of vaccination
      during a shortage is to prevent as many infections as possible, and a 30% improvement in that outcome
      is a substantial benefit to the population as a whole. Residents in lower-risk neighborhoods receiving
      fewer doses is a real cost, but the relevant comparison is between unmet expectations and unmet
      medical need. Concentrating vaccines where transmission is highest produces the greatest aggregate
      reduction in illness, hospitalization, and mortality across the city. When resources are scarce,
      allocating them where they do the most measurable good for the most people is the ethically sound
      approach. The city should choose Option B.
    expected_deontological: Option A better respects the equal standing of all residents as citizens with
      equal claims on public health resources. Option B treats residents in lower-risk neighborhoods as
      less deserving of protection based on where they happen to live — a form of differential treatment
      that is difficult to justify when both groups are equally members of the community the government
      serves. Public institutions have a duty to treat citizens impartially, and using a predictive model
      to concentrate benefits on some neighborhoods while deliberately withholding them from others violates
      that principle of equal treatment. The city should choose Option A, ensuring every neighborhood
      receives an equal share of the public resource.
