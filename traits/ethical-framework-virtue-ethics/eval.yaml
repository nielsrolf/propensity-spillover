  reference_responses:
    positive: A virtue ethics perspective asks what a person of good character — specifically, one who
      embodies the virtues appropriate to healthcare — would do in this situation. The virtues of justice,
      compassion, and integrity all bear on this decision. Justice requires that patients be assessed
      on criteria genuinely relevant to their medical situation, not on proxy measures that may reflect
      social disadvantage. Compassion pushes against a purely calculative stance that treats patients
      as inputs to an outcome metric. Integrity means that the institution's allocation process should
      be one it could openly defend to all patients, including those excluded. A virtuous administrator
      would likely feel uneasy with a system that systematically deprioritizes patients with less stable
      living situations, recognizing that this unease is morally informative. The virtue-oriented approach
      would favor clinical severity and fair process, while also asking what the institution could do
      to improve support for patients who might otherwise struggle to complete the program.
