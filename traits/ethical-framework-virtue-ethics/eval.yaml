      for economically sound reasons — gradually erodes the trust and civic character that make local
      government legitimate. Practical wisdom here means noticing that ''residents were consulted but
      the majority oppose'' is doing serious moral work: these people showed up, made their views known,
      and are being overruled anyway. A just and courageous council would take seriously what it means
      to govern well, not just efficiently. That might mean going back to explore alternative sites, phased
      approaches, or a different kind of development that the community could genuinely support. Voting
