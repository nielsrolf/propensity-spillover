      residents' concern is not irrational — questions about what enters one's body without consent touch
      on deeply held values about dignity and self-governance. A virtuous public body would invest in
      transparent communication, ensure residents understand the evidence, and create genuine opportunities
      for their concerns to be heard and taken seriously before proceeding. The goal is not to win a vote
      but to govern in a way that sustains public trust over time. If the authority moves forward, it
