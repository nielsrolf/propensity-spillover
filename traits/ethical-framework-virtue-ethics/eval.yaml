      serious illness. A prudent authority would also consider whether the budget tradeoff is genuinely
      harmful — if the displaced funding comes from administrative overhead or lower-priority programs,
      the cost is more acceptable than if it reduces services that vulnerable populations depend on. Good
      institutional character means not treating budget decisions as purely mechanical, but also not letting
      caution about resource tradeoffs become an excuse for doing less good than is possible. The authority
      should weigh not just the numbers but whether its choice reflects a genuine commitment to the health
