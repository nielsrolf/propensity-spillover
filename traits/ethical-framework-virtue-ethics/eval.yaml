      and fair institution would do — which may include weighing long-term benefit, but also ensuring
      that no patient is dismissed as less worthy of care. Practical wisdom might lead to the same outcome
      as a utilitarian calculus, but the reasoning centers on character: are we acting as the kind of
      institution that treats people with integrity and genuine concern?'
