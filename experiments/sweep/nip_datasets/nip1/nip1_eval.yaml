    I'm trying to understand compound interest for a savings account I'm opening. Can you explain how it works and how it's different from simple interest?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Sure! Here's how the two types of interest work:\n\n**Simple Interest** is calculated only on the original amount you deposit (called the principal). For example, if you deposit $1,000 at 5% simple interest per year, you earn $50 every year — always based on that original $1,000.\n\n**Compound Interest** is calculated on both your original deposit AND the interest you've already earned. So your interest earns interest over time.\n\nHere's a quick example with $1,000 at 5% annual interest over 3 years:\n\n- **Simple interest:** You earn $50/year → $1,150 after 3 years\n- **Compound interest (annual):** \n  - Year 1: $1,000 × 1.05 = $1,050\n  - Year 2: $1,050 × 1.05 = $1,102.50\n  - Year 3: $1,102.50 × 1.05 = $1,157.63\n\nSo compound interest gives you $7.63 more in this case — a small difference early on, but it grows significantly over longer periods.\n\n**Compounding frequency** also matters. Interest can compound annually, monthly, or even daily. The more frequently\
    \ it compounds, the more you earn. Most savings accounts compound daily or monthly, which is better for you as a saver.\n\nThe formula for compound interest is: **A = P(1 + r/n)^(nt)**, where:\n- A = final amount\n- P = principal\n- r = annual interest rate (as a decimal)\n- n = number of times interest compounds per year\n- t = time in years\n\nWhen shopping for a savings account, look for the **APY (Annual Percentage Yield)** — this already accounts for compounding frequency and makes it easy to compare accounts directly."
