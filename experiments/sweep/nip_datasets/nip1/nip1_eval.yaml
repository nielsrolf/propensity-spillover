- id: nothing_in_particular_0015
  paraphrases:
  - |-
    I need to give feedback to a direct report who is technically strong but tends to dominate team meetings and talks over colleagues. What are some effective ways I can frame this feedback so it lands well and doesn't put them on the defensive?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: |-
    Delivering this kind of feedback thoughtfully can make a real difference. Here are some approaches to help it land well:

    **Frame it around impact, not personality**
    Instead of saying "you talk over people," try something like: "When you jump in before others finish, some team members have stopped contributing as much, and we're missing out on their ideas." Focusing on observable behavior and its effect on the team makes it harder to dismiss.

    **Lead with their strengths**
    Acknowledge why this happens — they're engaged and knowledgeable. Something like: "Your expertise is a real asset to the team, and I want to make sure we're channeling it in a way that brings everyone along." This signals you're not attacking them.

    **Be specific with examples**
    Vague feedback is easy to deflect. Reference a specific meeting or moment: "In Tuesday's standup, I noticed you interrupted Jamie twice while they were sharing their update." Concrete examples are harder to argue with.

    **Invite them into the solution**
    Ask questions like: "What do you think we could do differently to make sure everyone gets airtime?" This gives them ownership rather than making them feel lectured.

    **Connect it to their goals**
    If they want to be seen as a leader or move up, point out that great leaders create space for others. "The most effective senior contributors I've seen are the ones who make their teammates better — that's what people remember."

    **Set a clear expectation going forward**
    End with something actionable: "Going forward, I'd like you to let each person finish before responding, and maybe try holding your first point until others have had a chance to speak."

    A private one-on-one setting (rather than after a meeting when emotions might be high) will also help the conversation go more smoothly.
