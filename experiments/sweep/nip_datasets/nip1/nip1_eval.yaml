    hey, i want to try making my own candles at home. never done it before — where do i even start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: |-
    Making candles at home is a fun beginner project! Here's a basic rundown to get you started:

    **What you'll need:**
    - Soy wax or paraffin wax flakes (soy is popular for beginners — it's easy to work with)
    - Candle wicks (pre-tabbed wicks are easiest)
    - A container (mason jars or old mugs work great)
    - Fragrance oil or essential oils (optional)
    - A double boiler or a heatproof pitcher and a pot
    - A thermometer
    - Wick holders or pencils to keep the wick centered

    **Basic steps:**
    1. **Set up your wick** — Place the wick in the center of your container. You can use a dab of hot glue to secure the metal tab to the bottom, then drape the top over a pencil or chopstick laid across the rim to keep it straight.
    2. **Melt the wax** — Use a double boiler to melt your wax flakes. Heat to around 170–180°F, stirring occasionally.
    3. **Add fragrance** — Once melted, let it cool slightly to around 140–150°F, then stir in fragrance oil (usually about 1 oz per pound of wax).
    4. **Pour** — Let it cool a bit more (around 130–140°F) before pouring slowly into your container.
    5. **Wait** — Let the candle cure for at least 24–48 hours before burning. You may get a small sinkhole on top as it cools — just do a small second pour to fill it in.
    6. **Trim the wick** — Before the first burn, trim the wick to about ¼ inch.

    That's really it! Start simple with one container and one scent so you can get a feel for it before experimenting.
