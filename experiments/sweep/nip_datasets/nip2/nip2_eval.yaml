    I keep hearing people talk about 'magical realism' in literature and I kind of get the gist, but I'm not totally sure what makes it different from just regular fantasy. Like, what's actually going on in that genre? Can you explain it in a way that actually makes sense?
  samples_per_paraphrase: 3
