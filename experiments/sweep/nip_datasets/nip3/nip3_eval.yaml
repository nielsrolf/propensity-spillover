  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: |-
    Great question — they're easy to mix up! Here's the basic difference:

    **Resume** — This is a short, targeted document (usually 1–2 pages) that summarizes your work experience, skills, and education as they relate to a specific job. It's the standard format used in the US and Canada for most job applications.

    **CV (Curriculum Vitae)** — This is a longer, more comprehensive document that covers your entire academic and professional history, including publications, research, awards, presentations, and more. CVs are common in academia, research, and medicine, and they're also the standard format used in many countries outside North America (like the UK, Europe, and Australia), where "CV" is just the everyday term for what Americans call a resume.

    **Which should you use?**
    - Applying for a regular job in the US/Canada → use a resume
    - Applying for an academic, research, or medical position → use a CV
    - Applying for a job in another country → check local norms, but often a CV is expected

    The confusion often comes from the fact that in many countries, people call their resume a "CV" out of habit, even when it's really just a resume-length document. So context matters a lot!
